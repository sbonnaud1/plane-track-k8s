---
# Schema Registry (cp-schema-registry:7.9.0)
# Confluent 7.9 configure script exits 1 if SCHEMA_REGISTRY_PORT is set to any
# non-empty value (deprecated field guard). Kubernetes auto-injects
# SCHEMA_REGISTRY_PORT=tcp://ClusterIP:8081 from the same-namespace Service.
# Fix: enableServiceLinks: false prevents Kubernetes from injecting *any* service
# env vars into this pod, so the configure script never sees the field.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: schema-registry
  namespace: plane-track
  labels:
    app: schema-registry
    app.kubernetes.io/part-of: plane-track
spec:
  replicas: 1
  selector:
    matchLabels:
      app: schema-registry
  template:
    metadata:
      labels:
        app: schema-registry
    spec:
      serviceAccountName: plane-track-sa
      # Prevent Kubernetes from injecting SERVICE_HOST / SERVICE_PORT env vars
      # (incl. SCHEMA_REGISTRY_PORT) which would trigger the Confluent exit guard.
      enableServiceLinks: false
      containers:
        - name: schema-registry
          image: docker.io/confluentinc/cp-schema-registry:7.9.0
          env:
            - name: SCHEMA_REGISTRY_HOST_NAME
              value: "schema-registry"
            - name: SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS
              value: "broker:29092"
            - name: SCHEMA_REGISTRY_LISTENERS
              value: "http://0.0.0.0:8081"
            - name: SCHEMA_REGISTRY_KAFKASTORE_SECURITY_PROTOCOL
              value: "PLAINTEXT"
            # Redirect log4j file output to /tmp (writable under OpenShift read-only root fs).
            - name: SCHEMA_REGISTRY_OPTS
              value: "-Dschema-registry.log.dir=/tmp"
            - name: LOG4J_OPTS
              value: "-Dschema-registry.log.dir=/tmp"
          ports:
            - containerPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: schema-registry
  namespace: plane-track
spec:
  selector:
    app: schema-registry
  ports:
    - port: 8081
      targetPort: 8081
