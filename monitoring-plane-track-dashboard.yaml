---
# =============================================================================
#  Grafana Dashboard — Plane Track / ORY CEP Pipeline
#  Metrics sources:
#    - kube-state-metrics  : kube_deployment_*, kube_pod_*
#    - cAdvisor            : container_cpu_*, container_memory_*, container_network_*
#    - alerts-dashboard /metrics (prometheus-flask-exporter + prometheus_client):
#        cep_alerts_total{topic, source}         — counter per topic/source
#        cep_alerts_in_window{topic, source}     — gauge (deque snapshot)
#        adsb_raw_vectors_total                  — gauge
#        flask_http_request_total, flask_http_request_duration_seconds_*
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-plane-track
  namespace: test-app
  labels:
    app: grafana
    app.kubernetes.io/part-of: test-app
    grafana-dashboard: "true"
data:
  plane-track.json: |
    {
      "title": "Plane Track \u2014 ORY CEP Pipeline",
      "uid": "plane-track",
      "tags": ["plane-track","kafka","flink","eurocontrol","ory","cep"],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [

        { "id": 1, "type": "row", "title": "\ud83d\udea6 Pipeline Health", "gridPos": {"x":0,"y":0,"w":24,"h":1}, "collapsed": false },

        {
          "id": 2, "type": "stat", "title": "Kafka Broker",
          "gridPos": {"x":0,"y":1,"w":4,"h":4},
          "datasource": {"type":"prometheus","uid":"PBFA97CFB590B2093"},
          "targets": [{"expr":"kube_deployment_status_replicas_available{namespace=\"plane-track\",deployment=\"broker\"}","legendFormat":"","refId":"A"}],
          "options": {"colorMode":"background","graphMode":"none","reduceOptions":{"calcs":["lastNotNull"]}},
          "fieldConfig": {"defaults":{"mappings":[{"type":"value","options":{"0":{"text":"DOWN","color":"red","index":0}}},{"type":"value","options":{"1":{"text":"UP","color":"green","index":1}}}],"thresholds":{"mode":"absolute","steps":[]}}}
        },
        {
          "id": 3, "type": "stat", "title": "Schema Registry",
          "gridPos": {"x":4,"y":1,"w":4,"h":4},
          "datasource": {"type":"prometheus","uid":"PBFA97CFB590B2093"},
          "targets": [{"expr":"kube_deployment_status_replicas_available{namespace=\"plane-track\",deployment=\"schema-registry\"}","legendFormat":"","refId":"A"}],
          "options": {"colorMode":"background","graphMode":"none","reduceOptions":{"calcs":["lastNotNull"]}},
          "fieldConfig": {"defaults":{"mappings":[{"type":"value","options":{"0":{"text":"DOWN","color":"red","index":0}}},{"type":"value","options":{"1":{"text":"UP","color":"green","index":1}}}],"thresholds":{"mode":"absolute","steps":[]}}}
        },
        {
          "id": 4, "type": "stat", "title": "Flink JobManager",
          "gridPos": {"x":8,"y":1,"w":4,"h":4},
          "datasource": {"type":"prometheus","uid":"PBFA97CFB590B2093"},
          "targets": [{"expr":"kube_deployment_status_replicas_available{namespace=\"plane-track\",deployment=\"flink-jobmanager\"}","legendFormat":"","refId":"A"}],
          "options": {"colorMode":"background","graphMode":"none","reduceOptions":{"calcs":["lastNotNull"]}},
          "fieldConfig": {"defaults":{"mappings":[{"type":"value","options":{"0":{"text":"DOWN","color":"red","index":0}}},{"type":"value","options":{"1":{"text":"UP","color":"green","index":1}}}],"thresholds":{"mode":"absolute","steps":[]}}}
        },
        {
          "id": 5, "type": "stat", "title": "Flink TaskManager",
          "gridPos": {"x":12,"y":1,"w":4,"h":4},
          "datasource": {"type":"prometheus","uid":"PBFA97CFB590B2093"},
          "targets": [{"expr":"kube_deployment_status_replicas_available{namespace=\"plane-track\",deployment=\"flink-taskmanager\"}","legendFormat":"","refId":"A"}],
          "options": {"colorMode":"background","graphMode":"none","reduceOptions":{"calcs":["lastNotNull"]}},
          "fieldConfig": {"defaults":{"mappings":[{"type":"value","options":{"0":{"text":"DOWN","color":"red","index":0}}},{"type":"value","options":{"1":{"text":"UP","color":"green","index":1}}}],"thresholds":{"mode":"absolute","steps":[]}}}
        },
        {
          "id": 6, "type": "stat", "title": "ADS-B Producer",
          "gridPos": {"x":16,"y":1,"w":4,"h":4},
          "datasource": {"type":"prometheus","uid":"PBFA97CFB590B2093"},
          "targets": [{"expr":"kube_deployment_status_replicas_available{namespace=\"plane-track\",deployment=\"adsb-producer\"}","legendFormat":"","refId":"A"}],
          "options": {"colorMode":"background","graphMode":"none","reduceOptions":{"calcs":["lastNotNull"]}},
          "fieldConfig": {"defaults":{"mappings":[{"type":"value","options":{"0":{"text":"DOWN","color":"red","index":0}}},{"type":"value","options":{"1":{"text":"UP","color":"green","index":1}}}],"thresholds":{"mode":"absolute","steps":[]}}}
        },
        {
          "id": 7, "type": "stat", "title": "Alerts Dashboard",
          "gridPos": {"x":20,"y":1,"w":4,"h":4},
          "datasource": {"type":"prometheus","uid":"PBFA97CFB590B2093"},
          "targets": [{"expr":"kube_deployment_status_replicas_available{namespace=\"plane-track\",deployment=\"alerts-dashboard\"}","legendFormat":"","refId":"A"}],
          "options": {"colorMode":"background","graphMode":"none","reduceOptions":{"calcs":["lastNotNull"]}},
          "fieldConfig": {"defaults":{"mappings":[{"type":"value","options":{"0":{"text":"DOWN","color":"red","index":0}}},{"type":"value","options":{"1":{"text":"UP","color":"green","index":1}}}],"thresholds":{"mode":"absolute","steps":[]}}}
        },

        { "id": 9, "type": "row", "title": "\ud83e\uddea ADS-B Simulator & Pods", "gridPos": {"x":0,"y":5,"w":24,"h":1}, "collapsed": false },

        {
          "id": 8, "type": "stat", "title": "ADS-B Simulator",
          "gridPos": {"x":0,"y":6,"w":4,"h":4},
          "datasource": {"type":"prometheus","uid":"PBFA97CFB590B2093"},
          "targets": [{"expr":"kube_deployment_status_replicas_available{namespace=\"plane-track\",deployment=\"adsb-simulator\"}","legendFormat":"","refId":"A"}],
          "options": {"colorMode":"background","graphMode":"none","reduceOptions":{"calcs":["lastNotNull"]}},
          "fieldConfig": {"defaults":{"mappings":[{"type":"value","options":{"0":{"text":"STOPPED","color":"orange","index":0}}},{"type":"value","options":{"1":{"text":"RUNNING","color":"green","index":1}}}],"thresholds":{"mode":"absolute","steps":[]}}}
        },
        {
          "id": 16, "type": "stat", "title": "Pods Running (total)",
          "gridPos": {"x":4,"y":6,"w":4,"h":4},
          "datasource": {"type":"prometheus","uid":"PBFA97CFB590B2093"},
          "targets": [{"expr":"count(kube_pod_info{namespace=\"plane-track\"})","legendFormat":"","refId":"A"}],
          "options": {"colorMode":"value","graphMode":"none","reduceOptions":{"calcs":["lastNotNull"]}},
          "fieldConfig": {"defaults":{"thresholds":{"mode":"absolute","steps":[{"color":"red","value":null},{"color":"orange","value":4},{"color":"green","value":6}]}}}
        },
        {
          "id": 17, "type": "stat", "title": "Total Restarts Pipeline",
          "gridPos": {"x":8,"y":6,"w":4,"h":4},
          "datasource": {"type":"prometheus","uid":"PBFA97CFB590B2093"},
          "targets": [{"expr":"sum(kube_pod_container_status_restarts_total{namespace=\"plane-track\"})","legendFormat":"","refId":"A"}],
          "options": {"colorMode":"background","graphMode":"area","reduceOptions":{"calcs":["lastNotNull"]}},
          "fieldConfig": {"defaults":{"thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"orange","value":5},{"color":"red","value":15}]}}}
        },
        {
          "id": 18, "type": "stat", "title": "Deployments Ready / 7",
          "gridPos": {"x":12,"y":6,"w":4,"h":4},
          "datasource": {"type":"prometheus","uid":"PBFA97CFB590B2093"},
          "targets": [{"expr":"count(kube_deployment_status_replicas_available{namespace=\"plane-track\"} == kube_deployment_spec_replicas{namespace=\"plane-track\"})","legendFormat":"","refId":"A"}],
          "options": {"colorMode":"background","graphMode":"none","reduceOptions":{"calcs":["lastNotNull"]}},
          "fieldConfig": {"defaults":{"thresholds":{"mode":"absolute","steps":[{"color":"red","value":null},{"color":"orange","value":5},{"color":"green","value":7}]}}}
        },
        {
          "id": 80, "type": "stat", "title": "ADS-B Vectors en m\u00e9moire",
          "gridPos": {"x":16,"y":6,"w":4,"h":4},
          "datasource": {"type":"prometheus","uid":"PBFA97CFB590B2093"},
          "targets": [{"expr":"adsb_raw_vectors_total{job=\"alerts-dashboard\"} or vector(0)","legendFormat":"","refId":"A"}],
          "options": {"colorMode":"value","graphMode":"area","reduceOptions":{"calcs":["lastNotNull"]}},
          "fieldConfig": {"defaults":{"unit":"short","thresholds":{"mode":"absolute","steps":[{"color":"blue","value":null}]}}}
        },
        {
          "id": 81, "type": "stat", "title": "Dashboard — Uptime",
          "gridPos": {"x":20,"y":6,"w":4,"h":4},
          "datasource": {"type":"prometheus","uid":"PBFA97CFB590B2093"},
          "targets": [{"expr":"process_start_time_seconds{job=\"alerts-dashboard\"}","legendFormat":"","refId":"A"}],
          "options": {"colorMode":"value","graphMode":"none","reduceOptions":{"calcs":["lastNotNull"]}},
          "fieldConfig": {"defaults":{"unit":"dateTimeFromNow"}}
        },

        { "id": 50, "type": "row", "title": "\u2708 CEP Alertes \u2014 Compteurs par type", "gridPos": {"x":0,"y":10,"w":24,"h":1}, "collapsed": false },

        {
          "id": 51, "type": "stat", "title": "\ud83d\udd34 Missed Approach",
          "gridPos": {"x":0,"y":11,"w":4,"h":5},
          "datasource": {"type":"prometheus","uid":"PBFA97CFB590B2093"},
          "targets": [
            {"expr":"sum(cep_alerts_total{job=\"alerts-dashboard\",topic=\"ory_missed_approach\"}) or vector(0)","legendFormat":"Total","refId":"A"},
            {"expr":"sum(cep_alerts_in_window{job=\"alerts-dashboard\",topic=\"ory_missed_approach\",source=\"live\"}) or vector(0)","legendFormat":"Live","refId":"B"},
            {"expr":"sum(cep_alerts_in_window{job=\"alerts-dashboard\",topic=\"ory_missed_approach\",source=\"simulated\"}) or vector(0)","legendFormat":"Sim","refId":"C"}
          ],
          "options": {"colorMode":"background","graphMode":"area","reduceOptions":{"calcs":["lastNotNull"]}},
          "fieldConfig": {"defaults":{"thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"orange","value":3},{"color":"red","value":10}]},"unit":"short"}}
        },
        {
          "id": 52, "type": "stat", "title": "\ud83d\udfe1 Twin Landing",
          "gridPos": {"x":4,"y":11,"w":4,"h":5},
          "datasource": {"type":"prometheus","uid":"PBFA97CFB590B2093"},
          "targets": [
            {"expr":"sum(cep_alerts_total{job=\"alerts-dashboard\",topic=\"ory_twin_landing\"}) or vector(0)","legendFormat":"Total","refId":"A"},
            {"expr":"sum(cep_alerts_in_window{job=\"alerts-dashboard\",topic=\"ory_twin_landing\",source=\"simulated\"}) or vector(0)","legendFormat":"Sim","refId":"B"}
          ],
          "options": {"colorMode":"background","graphMode":"area","reduceOptions":{"calcs":["lastNotNull"]}},
          "fieldConfig": {"defaults":{"thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"orange","value":2},{"color":"red","value":8}]},"unit":"short"}}
        },
        {
          "id": 53, "type": "stat", "title": "\ud83d\udd01 Repeat Go-Around",
          "gridPos": {"x":8,"y":11,"w":4,"h":5},
          "datasource": {"type":"prometheus","uid":"PBFA97CFB590B2093"},
          "targets": [
            {"expr":"sum(cep_alerts_total{job=\"alerts-dashboard\",topic=\"ory_repeated_goaround\"}) or vector(0)","legendFormat":"Total","refId":"A"},
            {"expr":"sum(cep_alerts_in_window{job=\"alerts-dashboard\",topic=\"ory_repeated_goaround\",source=\"live\"}) or vector(0)","legendFormat":"Live","refId":"B"},
            {"expr":"sum(cep_alerts_in_window{job=\"alerts-dashboard\",topic=\"ory_repeated_goaround\",source=\"simulated\"}) or vector(0)","legendFormat":"Sim","refId":"C"}
          ],
          "options": {"colorMode":"background","graphMode":"area","reduceOptions":{"calcs":["lastNotNull"]}},
          "fieldConfig": {"defaults":{"thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"orange","value":1},{"color":"red","value":3}]},"unit":"short"}}
        },
        {
          "id": 54, "type": "stat", "title": "\ud83d\udd3b Rapid Descent",
          "gridPos": {"x":12,"y":11,"w":4,"h":5},
          "datasource": {"type":"prometheus","uid":"PBFA97CFB590B2093"},
          "targets": [
            {"expr":"sum(cep_alerts_total{job=\"alerts-dashboard\",topic=\"ory_rapid_descent\"}) or vector(0)","legendFormat":"Total","refId":"A"},
            {"expr":"sum(cep_alerts_in_window{job=\"alerts-dashboard\",topic=\"ory_rapid_descent\",source=\"live\"}) or vector(0)","legendFormat":"Live","refId":"B"},
            {"expr":"sum(cep_alerts_in_window{job=\"alerts-dashboard\",topic=\"ory_rapid_descent\",source=\"simulated\"}) or vector(0)","legendFormat":"Sim","refId":"C"}
          ],
          "options": {"colorMode":"background","graphMode":"area","reduceOptions":{"calcs":["lastNotNull"]}},
          "fieldConfig": {"defaults":{"thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"orange","value":1},{"color":"red","value":3}]},"unit":"short"}}
        },
        {
          "id": 55, "type": "stat", "title": "\ud83d\udd35 Corridor Overload",
          "gridPos": {"x":16,"y":11,"w":4,"h":5},
          "datasource": {"type":"prometheus","uid":"PBFA97CFB590B2093"},
          "targets": [
            {"expr":"sum(cep_alerts_total{job=\"alerts-dashboard\",topic=\"ory_corridor_overload\"}) or vector(0)","legendFormat":"Total","refId":"A"},
            {"expr":"sum(cep_alerts_in_window{job=\"alerts-dashboard\",topic=\"ory_corridor_overload\",source=\"live\"}) or vector(0)","legendFormat":"Live","refId":"B"},
            {"expr":"sum(cep_alerts_in_window{job=\"alerts-dashboard\",topic=\"ory_corridor_overload\",source=\"simulated\"}) or vector(0)","legendFormat":"Sim","refId":"C"}
          ],
          "options": {"colorMode":"background","graphMode":"area","reduceOptions":{"calcs":["lastNotNull"]}},
          "fieldConfig": {"defaults":{"thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"orange","value":1},{"color":"red","value":3}]},"unit":"short"}}
        },
        {
          "id": 56, "type": "stat", "title": "\u2211 Total alertes (toutes sources)",
          "gridPos": {"x":20,"y":11,"w":4,"h":5},
          "datasource": {"type":"prometheus","uid":"PBFA97CFB590B2093"},
          "targets": [
            {"expr":"sum(cep_alerts_total{job=\"alerts-dashboard\"}) or vector(0)","legendFormat":"Total","refId":"A"}
          ],
          "options": {"colorMode":"value","graphMode":"area","reduceOptions":{"calcs":["lastNotNull"]}},
          "fieldConfig": {"defaults":{"unit":"short","thresholds":{"mode":"absolute","steps":[{"color":"blue","value":null}]}}}
        },

        {
          "id": 60, "type": "timeseries", "title": "Alertes CEP \u2014 total accumul\u00e9 par type (counter)",
          "gridPos": {"x":0,"y":16,"w":24,"h":9},
          "datasource": {"type":"prometheus","uid":"PBFA97CFB590B2093"},
          "targets": [
            {"expr":"sum by (topic) (cep_alerts_total{job=\"alerts-dashboard\",topic=\"ory_missed_approach\"})","legendFormat":"\ud83d\udd34 Missed Approach","refId":"A"},
            {"expr":"sum by (topic) (cep_alerts_total{job=\"alerts-dashboard\",topic=\"ory_twin_landing\"})","legendFormat":"\ud83d\udfe1 Twin Landing","refId":"B"},
            {"expr":"sum by (topic) (cep_alerts_total{job=\"alerts-dashboard\",topic=\"ory_repeated_goaround\"})","legendFormat":"\ud83d\udd01 Repeat Go-Around","refId":"C"},
            {"expr":"sum by (topic) (cep_alerts_total{job=\"alerts-dashboard\",topic=\"ory_rapid_descent\"})","legendFormat":"\ud83d\udd3b Rapid Descent","refId":"D"},
            {"expr":"sum by (topic) (cep_alerts_total{job=\"alerts-dashboard\",topic=\"ory_corridor_overload\"})","legendFormat":"\ud83d\udd35 Corridor Overload","refId":"E"}
          ],
          "fieldConfig": {"defaults":{"unit":"short","custom":{"lineWidth":2,"fillOpacity":6},"color":{"mode":"palette-classic"}}},
          "options": {"tooltip":{"mode":"multi","sort":"desc"}}
        },

        {
          "id": 61, "type": "timeseries", "title": "Alertes CEP \u2014 taux par minute par type",
          "gridPos": {"x":0,"y":25,"w":12,"h":8},
          "datasource": {"type":"prometheus","uid":"PBFA97CFB590B2093"},
          "targets": [
            {"expr":"rate(cep_alerts_total{job=\"alerts-dashboard\",topic=\"ory_missed_approach\"}[5m]) * 60","legendFormat":"\ud83d\udd34 Missed Approach","refId":"A"},
            {"expr":"rate(cep_alerts_total{job=\"alerts-dashboard\",topic=\"ory_twin_landing\"}[5m]) * 60","legendFormat":"\ud83d\udfe1 Twin Landing","refId":"B"},
            {"expr":"rate(cep_alerts_total{job=\"alerts-dashboard\",topic=\"ory_repeated_goaround\"}[5m]) * 60","legendFormat":"\ud83d\udd01 Repeat Go-Around","refId":"C"},
            {"expr":"rate(cep_alerts_total{job=\"alerts-dashboard\",topic=\"ory_rapid_descent\"}[5m]) * 60","legendFormat":"\ud83d\udd3b Rapid Descent","refId":"D"},
            {"expr":"rate(cep_alerts_total{job=\"alerts-dashboard\",topic=\"ory_corridor_overload\"}[5m]) * 60","legendFormat":"\ud83d\udd35 Corridor Overload","refId":"E"}
          ],
          "fieldConfig": {"defaults":{"unit":"short","custom":{"lineWidth":2,"fillOpacity":10},"color":{"mode":"palette-classic"}}},
          "options": {"tooltip":{"mode":"multi"}}
        },

        {
          "id": 62, "type": "timeseries", "title": "Alertes dans la fen\u00eatre \u2014 Live vs Simul\u00e9 (snapshot d\u00e9que)",
          "gridPos": {"x":12,"y":25,"w":12,"h":8},
          "datasource": {"type":"prometheus","uid":"PBFA97CFB590B2093"},
          "targets": [
            {"expr":"sum(cep_alerts_in_window{job=\"alerts-dashboard\",source=\"live\"})","legendFormat":"\ud83d\udce1 Live (total)","refId":"A"},
            {"expr":"sum(cep_alerts_in_window{job=\"alerts-dashboard\",source=\"simulated\"})","legendFormat":"\ud83e\uddea Simul\u00e9 (total)","refId":"B"}
          ],
          "fieldConfig": {"defaults":{"unit":"short","custom":{"lineWidth":2,"fillOpacity":15},"color":{"mode":"palette-classic"}}},
          "options": {"tooltip":{"mode":"multi"}}
        },

        { "id": 19, "type": "row", "title": "\ud83d\udd04 Restarts par composant", "gridPos": {"x":0,"y":33,"w":24,"h":1}, "collapsed": false },

        {
          "id": 15, "type": "timeseries", "title": "Pod Restarts par composant",
          "gridPos": {"x":0,"y":34,"w":24,"h":8},
          "datasource": {"type":"prometheus","uid":"PBFA97CFB590B2093"},
          "targets": [
            {"expr":"kube_pod_container_status_restarts_total{namespace=\"plane-track\",container=\"broker\"}","legendFormat":"broker","refId":"A"},
            {"expr":"kube_pod_container_status_restarts_total{namespace=\"plane-track\",container=\"schema-registry\"}","legendFormat":"schema-registry","refId":"B"},
            {"expr":"kube_pod_container_status_restarts_total{namespace=\"plane-track\",container=\"flink-jobmanager\"}","legendFormat":"flink-jobmanager","refId":"C"},
            {"expr":"kube_pod_container_status_restarts_total{namespace=\"plane-track\",container=\"flink-taskmanager\"}","legendFormat":"flink-taskmanager","refId":"D"},
            {"expr":"kube_pod_container_status_restarts_total{namespace=\"plane-track\",container=\"adsb-producer\"}","legendFormat":"adsb-producer","refId":"E"},
            {"expr":"kube_pod_container_status_restarts_total{namespace=\"plane-track\",container=\"dashboard\"}","legendFormat":"alerts-dashboard","refId":"F"}
          ],
          "fieldConfig": {"defaults":{"unit":"short","custom":{"lineWidth":2},"color":{"mode":"palette-classic"}}}
        },

        { "id": 20, "type": "row", "title": "\ud83d\udcbe CPU & M\u00e9moire", "gridPos": {"x":0,"y":42,"w":24,"h":1}, "collapsed": false },

        {
          "id": 21, "type": "timeseries", "title": "CPU Usage \u2014 composants plane-track",
          "gridPos": {"x":0,"y":43,"w":12,"h":8},
          "datasource": {"type":"prometheus","uid":"PBFA97CFB590B2093"},
          "targets": [{"expr":"rate(container_cpu_usage_seconds_total{namespace=\"plane-track\",container!=\"\",container!=\"POD\"}[2m])","legendFormat":"{{container}}","refId":"A"}],
          "fieldConfig": {"defaults":{"unit":"short","custom":{"lineWidth":1},"color":{"mode":"palette-classic"}}}
        },
        {
          "id": 22, "type": "timeseries", "title": "M\u00e9moire RSS \u2014 composants plane-track",
          "gridPos": {"x":12,"y":43,"w":12,"h":8},
          "datasource": {"type":"prometheus","uid":"PBFA97CFB590B2093"},
          "targets": [{"expr":"container_memory_rss{namespace=\"plane-track\",container!=\"\",container!=\"POD\"}","legendFormat":"{{container}}","refId":"A"}],
          "fieldConfig": {"defaults":{"unit":"bytes","custom":{"lineWidth":1},"color":{"mode":"palette-classic"}}}
        },

        { "id": 30, "type": "row", "title": "\ud83c\udf10 R\u00e9seau Pipeline", "gridPos": {"x":0,"y":51,"w":24,"h":1}, "collapsed": false },

        {
          "id": 41, "type": "timeseries", "title": "R\u00e9seau \u2014 tous les pods plane-track (bytes/s)",
          "gridPos": {"x":0,"y":52,"w":24,"h":8},
          "datasource": {"type":"prometheus","uid":"PBFA97CFB590B2093"},
          "targets": [
            {"expr":"sum by (pod) (rate(container_network_receive_bytes_total{namespace=\"plane-track\"}[1m]))","legendFormat":"rx \u2193 {{pod}}","refId":"A"},
            {"expr":"sum by (pod) (rate(container_network_transmit_bytes_total{namespace=\"plane-track\"}[1m]))","legendFormat":"tx \u2191 {{pod}}","refId":"B"}
          ],
          "fieldConfig": {"defaults":{"unit":"Bps","custom":{"lineWidth":1},"color":{"mode":"palette-classic"}}}
        }

      ]
    }
