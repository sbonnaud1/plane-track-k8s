---
# =============================================================================
#  Grafana Dashboard — Plane Track / Eurocontrol ORY CEP Pipeline
#  Sections:
#    1. Pipeline Health        — déploiement K8s UP/DOWN
#    2. ADS-B & Simulator      — pods, restarts, état simulateur
#    3. CEP Alertes métier     — alertes par topic (Kafka offset lag)
#    4. Activité trafic ORY    — avions tracés, approches, au sol
#    5. Kafka — Lag & Messages — consumer lag par topic CEP
#    6. Restarts par composant — time series
#    7. CPU & Mémoire          — ressources conteneurs
#    8. Réseau Pipeline        — bytes/s
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-plane-track
  namespace: test-app
  labels:
    app: grafana
    app.kubernetes.io/part-of: test-app
    grafana-dashboard: "true"
data:
  plane-track.json: |
    {
      "title": "Plane Track \u2014 ORY CEP Pipeline",
      "uid": "plane-track",
      "tags": ["plane-track","kafka","flink","eurocontrol","ory","cep"],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [

        { "id": 1, "type": "row", "title": "\ud83d\udea6 Pipeline Health", "gridPos": {"x":0,"y":0,"w":24,"h":1}, "collapsed": false },

        {
          "id": 2, "type": "stat", "title": "Kafka Broker",
          "gridPos": {"x":0,"y":1,"w":4,"h":4},
          "datasource": {"type":"prometheus","uid":"PBFA97CFB590B2093"},
          "targets": [{"expr":"kube_deployment_status_replicas_available{namespace=\"plane-track\",deployment=\"broker\"}","legendFormat":"","refId":"A"}],
          "options": {"colorMode":"background","graphMode":"none","reduceOptions":{"calcs":["lastNotNull"]}},
          "fieldConfig": {"defaults":{"mappings":[
            {"type":"value","options":{"0":{"text":"DOWN","color":"red","index":0}}},
            {"type":"value","options":{"1":{"text":"UP","color":"green","index":1}}}
          ],"thresholds":{"mode":"absolute","steps":[]}}}
        },
        {
          "id": 3, "type": "stat", "title": "Schema Registry",
          "gridPos": {"x":4,"y":1,"w":4,"h":4},
          "datasource": {"type":"prometheus","uid":"PBFA97CFB590B2093"},
          "targets": [{"expr":"kube_deployment_status_replicas_available{namespace=\"plane-track\",deployment=\"schema-registry\"}","legendFormat":"","refId":"A"}],
          "options": {"colorMode":"background","graphMode":"none","reduceOptions":{"calcs":["lastNotNull"]}},
          "fieldConfig": {"defaults":{"mappings":[
            {"type":"value","options":{"0":{"text":"DOWN","color":"red","index":0}}},
            {"type":"value","options":{"1":{"text":"UP","color":"green","index":1}}}
          ],"thresholds":{"mode":"absolute","steps":[]}}}
        },
        {
          "id": 4, "type": "stat", "title": "Flink JobManager",
          "gridPos": {"x":8,"y":1,"w":4,"h":4},
          "datasource": {"type":"prometheus","uid":"PBFA97CFB590B2093"},
          "targets": [{"expr":"kube_deployment_status_replicas_available{namespace=\"plane-track\",deployment=\"flink-jobmanager\"}","legendFormat":"","refId":"A"}],
          "options": {"colorMode":"background","graphMode":"none","reduceOptions":{"calcs":["lastNotNull"]}},
          "fieldConfig": {"defaults":{"mappings":[
            {"type":"value","options":{"0":{"text":"DOWN","color":"red","index":0}}},
            {"type":"value","options":{"1":{"text":"UP","color":"green","index":1}}}
          ],"thresholds":{"mode":"absolute","steps":[]}}}
        },
        {
          "id": 5, "type": "stat", "title": "Flink TaskManager",
          "gridPos": {"x":12,"y":1,"w":4,"h":4},
          "datasource": {"type":"prometheus","uid":"PBFA97CFB590B2093"},
          "targets": [{"expr":"kube_deployment_status_replicas_available{namespace=\"plane-track\",deployment=\"flink-taskmanager\"}","legendFormat":"","refId":"A"}],
          "options": {"colorMode":"background","graphMode":"none","reduceOptions":{"calcs":["lastNotNull"]}},
          "fieldConfig": {"defaults":{"mappings":[
            {"type":"value","options":{"0":{"text":"DOWN","color":"red","index":0}}},
            {"type":"value","options":{"1":{"text":"UP","color":"green","index":1}}}
          ],"thresholds":{"mode":"absolute","steps":[]}}}
        },
        {
          "id": 6, "type": "stat", "title": "ADS-B Producer",
          "gridPos": {"x":16,"y":1,"w":4,"h":4},
          "datasource": {"type":"prometheus","uid":"PBFA97CFB590B2093"},
          "targets": [{"expr":"kube_deployment_status_replicas_available{namespace=\"plane-track\",deployment=\"adsb-producer\"}","legendFormat":"","refId":"A"}],
          "options": {"colorMode":"background","graphMode":"none","reduceOptions":{"calcs":["lastNotNull"]}},
          "fieldConfig": {"defaults":{"mappings":[
            {"type":"value","options":{"0":{"text":"DOWN","color":"red","index":0}}},
            {"type":"value","options":{"1":{"text":"UP","color":"green","index":1}}}
          ],"thresholds":{"mode":"absolute","steps":[]}}}
        },
        {
          "id": 7, "type": "stat", "title": "Alerts Dashboard",
          "gridPos": {"x":20,"y":1,"w":4,"h":4},
          "datasource": {"type":"prometheus","uid":"PBFA97CFB590B2093"},
          "targets": [{"expr":"kube_deployment_status_replicas_available{namespace=\"plane-track\",deployment=\"alerts-dashboard\"}","legendFormat":"","refId":"A"}],
          "options": {"colorMode":"background","graphMode":"none","reduceOptions":{"calcs":["lastNotNull"]}},
          "fieldConfig": {"defaults":{"mappings":[
            {"type":"value","options":{"0":{"text":"DOWN","color":"red","index":0}}},
            {"type":"value","options":{"1":{"text":"UP","color":"green","index":1}}}
          ],"thresholds":{"mode":"absolute","steps":[]}}}
        },

        { "id": 9, "type": "row", "title": "\ud83e\uddea ADS-B Simulator & Pods", "gridPos": {"x":0,"y":5,"w":24,"h":1}, "collapsed": false },

        {
          "id": 8, "type": "stat", "title": "ADS-B Simulator",
          "gridPos": {"x":0,"y":6,"w":6,"h":4},
          "datasource": {"type":"prometheus","uid":"PBFA97CFB590B2093"},
          "targets": [{"expr":"kube_deployment_status_replicas_available{namespace=\"plane-track\",deployment=\"adsb-simulator\"}","legendFormat":"","refId":"A"}],
          "options": {"colorMode":"background","graphMode":"none","reduceOptions":{"calcs":["lastNotNull"]}},
          "fieldConfig": {"defaults":{"mappings":[
            {"type":"value","options":{"0":{"text":"STOPPED","color":"orange","index":0}}},
            {"type":"value","options":{"1":{"text":"RUNNING","color":"green","index":1}}}
          ],"thresholds":{"mode":"absolute","steps":[]}}}
        },
        {
          "id": 16, "type": "stat", "title": "Pods Running (total)",
          "gridPos": {"x":6,"y":6,"w":6,"h":4},
          "datasource": {"type":"prometheus","uid":"PBFA97CFB590B2093"},
          "targets": [{"expr":"count(kube_pod_info{namespace=\"plane-track\"})","legendFormat":"","refId":"A"}],
          "options": {"colorMode":"value","graphMode":"none","reduceOptions":{"calcs":["lastNotNull"]}},
          "fieldConfig": {"defaults":{"thresholds":{"mode":"absolute","steps":[{"color":"red","value":null},{"color":"orange","value":4},{"color":"green","value":6}]}}}
        },
        {
          "id": 17, "type": "stat", "title": "Total Restarts Pipeline",
          "gridPos": {"x":12,"y":6,"w":6,"h":4},
          "datasource": {"type":"prometheus","uid":"PBFA97CFB590B2093"},
          "targets": [{"expr":"sum(kube_pod_container_status_restarts_total{namespace=\"plane-track\"})","legendFormat":"","refId":"A"}],
          "options": {"colorMode":"background","graphMode":"area","reduceOptions":{"calcs":["lastNotNull"]}},
          "fieldConfig": {"defaults":{"thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"orange","value":5},{"color":"red","value":15}]}}}
        },
        {
          "id": 18, "type": "stat", "title": "Deployments Ready / 7",
          "gridPos": {"x":18,"y":6,"w":6,"h":4},
          "datasource": {"type":"prometheus","uid":"PBFA97CFB590B2093"},
          "targets": [{"expr":"count(kube_deployment_status_replicas_available{namespace=\"plane-track\"} == kube_deployment_spec_replicas{namespace=\"plane-track\"})","legendFormat":"","refId":"A"}],
          "options": {"colorMode":"background","graphMode":"none","reduceOptions":{"calcs":["lastNotNull"]}},
          "fieldConfig": {"defaults":{"thresholds":{"mode":"absolute","steps":[{"color":"red","value":null},{"color":"orange","value":5},{"color":"green","value":7}]}}}
        },

        { "id": 50, "type": "row", "title": "\u2708 CEP Alertes M\u00e9tier — Topics Kafka", "gridPos": {"x":0,"y":10,"w":24,"h":1}, "collapsed": false },

        {
          "id": 51, "type": "stat", "title": "\ud83d\udd34 Missed Approach",
          "gridPos": {"x":0,"y":11,"w":4,"h":4},
          "datasource": {"type":"prometheus","uid":"PBFA97CFB590B2093"},
          "targets": [{"expr":"kafka_log_log_size{topic=\"ory_missed_approach\",namespace=\"plane-track\"} or kube_pod_container_status_running{namespace=\"plane-track\",container=\"broker\"} * 0","legendFormat":"messages","refId":"A"}],
          "options": {"colorMode":"background","graphMode":"area","reduceOptions":{"calcs":["lastNotNull"]}},
          "fieldConfig": {"defaults":{"thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"orange","value":5},{"color":"red","value":20}]},"unit":"short"}}
        },
        {
          "id": 52, "type": "stat", "title": "\ud83d\udfe1 Twin Landing",
          "gridPos": {"x":4,"y":11,"w":4,"h":4},
          "datasource": {"type":"prometheus","uid":"PBFA97CFB590B2093"},
          "targets": [{"expr":"kafka_log_log_size{topic=\"ory_twin_landing\",namespace=\"plane-track\"} or kube_pod_container_status_running{namespace=\"plane-track\",container=\"broker\"} * 0","legendFormat":"messages","refId":"A"}],
          "options": {"colorMode":"background","graphMode":"area","reduceOptions":{"calcs":["lastNotNull"]}},
          "fieldConfig": {"defaults":{"thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"orange","value":3},{"color":"red","value":10}]},"unit":"short"}}
        },
        {
          "id": 53, "type": "stat", "title": "\ud83d\udd01 Repeat Go-Around",
          "gridPos": {"x":8,"y":11,"w":4,"h":4},
          "datasource": {"type":"prometheus","uid":"PBFA97CFB590B2093"},
          "targets": [{"expr":"kafka_log_log_size{topic=\"ory_repeated_goaround\",namespace=\"plane-track\"} or kube_pod_container_status_running{namespace=\"plane-track\",container=\"broker\"} * 0","legendFormat":"messages","refId":"A"}],
          "options": {"colorMode":"background","graphMode":"area","reduceOptions":{"calcs":["lastNotNull"]}},
          "fieldConfig": {"defaults":{"thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"orange","value":2},{"color":"red","value":5}]},"unit":"short"}}
        },
        {
          "id": 54, "type": "stat", "title": "\ud83d\udd3b Rapid Descent",
          "gridPos": {"x":12,"y":11,"w":4,"h":4},
          "datasource": {"type":"prometheus","uid":"PBFA97CFB590B2093"},
          "targets": [{"expr":"kafka_log_log_size{topic=\"ory_rapid_descent\",namespace=\"plane-track\"} or kube_pod_container_status_running{namespace=\"plane-track\",container=\"broker\"} * 0","legendFormat":"messages","refId":"A"}],
          "options": {"colorMode":"background","graphMode":"area","reduceOptions":{"calcs":["lastNotNull"]}},
          "fieldConfig": {"defaults":{"thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"orange","value":2},{"color":"red","value":5}]},"unit":"short"}}
        },
        {
          "id": 55, "type": "stat", "title": "\ud83d\udd35 Corridor Overload",
          "gridPos": {"x":16,"y":11,"w":4,"h":4},
          "datasource": {"type":"prometheus","uid":"PBFA97CFB590B2093"},
          "targets": [{"expr":"kafka_log_log_size{topic=\"ory_corridor_overload\",namespace=\"plane-track\"} or kube_pod_container_status_running{namespace=\"plane-track\",container=\"broker\"} * 0","legendFormat":"messages","refId":"A"}],
          "options": {"colorMode":"background","graphMode":"area","reduceOptions":{"calcs":["lastNotNull"]}},
          "fieldConfig": {"defaults":{"thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"orange","value":2},{"color":"red","value":5}]},"unit":"short"}}
        },
        {
          "id": 56, "type": "stat", "title": "\ud83d\udce1 ADS-B Raw (adsb_raw)",
          "gridPos": {"x":20,"y":11,"w":4,"h":4},
          "datasource": {"type":"prometheus","uid":"PBFA97CFB590B2093"},
          "targets": [{"expr":"kafka_log_log_size{topic=\"adsb_raw\",namespace=\"plane-track\"} or kube_pod_container_status_running{namespace=\"plane-track\",container=\"broker\"} * 0","legendFormat":"messages","refId":"A"}],
          "options": {"colorMode":"value","graphMode":"area","reduceOptions":{"calcs":["lastNotNull"]}},
          "fieldConfig": {"defaults":{"thresholds":{"mode":"absolute","steps":[{"color":"blue","value":null}]},"unit":"short"}}
        },

        {
          "id": 57, "type": "timeseries", "title": "Taux d'alertes CEP par topic (messages Kafka / min)",
          "gridPos": {"x":0,"y":15,"w":24,"h":8},
          "datasource": {"type":"prometheus","uid":"PBFA97CFB590B2093"},
          "targets": [
            {"expr":"rate(kafka_log_log_size{topic=\"ory_missed_approach\",namespace=\"plane-track\"}[2m]) * 60","legendFormat":"\ud83d\udd34 Missed Approach","refId":"A"},
            {"expr":"rate(kafka_log_log_size{topic=\"ory_twin_landing\",namespace=\"plane-track\"}[2m]) * 60","legendFormat":"\ud83d\udfe1 Twin Landing","refId":"B"},
            {"expr":"rate(kafka_log_log_size{topic=\"ory_repeated_goaround\",namespace=\"plane-track\"}[2m]) * 60","legendFormat":"\ud83d\udd01 Repeat Go-Around","refId":"C"},
            {"expr":"rate(kafka_log_log_size{topic=\"ory_rapid_descent\",namespace=\"plane-track\"}[2m]) * 60","legendFormat":"\ud83d\udd3b Rapid Descent","refId":"D"},
            {"expr":"rate(kafka_log_log_size{topic=\"ory_corridor_overload\",namespace=\"plane-track\"}[2m]) * 60","legendFormat":"\ud83d\udd35 Corridor Overload","refId":"E"}
          ],
          "fieldConfig": {"defaults":{"unit":"short","custom":{"lineWidth":2,"fillOpacity":10},"color":{"mode":"palette-classic"}}},
          "options": {"tooltip":{"mode":"multi"}}
        },

        { "id": 60, "type": "row", "title": "\ud83c\udff3 Activit\u00e9 Trafic ORY — ADS-B Live", "gridPos": {"x":0,"y":23,"w":24,"h":1}, "collapsed": false },

        {
          "id": 61, "type": "stat", "title": "Flask — Req /api/tracker (total)",
          "gridPos": {"x":0,"y":24,"w":6,"h":4},
          "datasource": {"type":"prometheus","uid":"PBFA97CFB590B2093"},
          "targets": [{"expr":"sum(flask_http_request_total{job=\"alerts-dashboard\",path=\"/api/tracker\"}) or vector(0)","legendFormat":"","refId":"A"}],
          "options": {"colorMode":"value","graphMode":"area","reduceOptions":{"calcs":["lastNotNull"]}},
          "fieldConfig": {"defaults":{"unit":"short"}}
        },
        {
          "id": 62, "type": "stat", "title": "Flask — Req /api/alerts (total)",
          "gridPos": {"x":6,"y":24,"w":6,"h":4},
          "datasource": {"type":"prometheus","uid":"PBFA97CFB590B2093"},
          "targets": [{"expr":"sum(flask_http_request_total{job=\"alerts-dashboard\",path=\"/api/alerts\"}) or vector(0)","legendFormat":"","refId":"A"}],
          "options": {"colorMode":"value","graphMode":"area","reduceOptions":{"calcs":["lastNotNull"]}},
          "fieldConfig": {"defaults":{"unit":"short"}}
        },
        {
          "id": 63, "type": "stat", "title": "Flask — Erreurs 5xx Dashboard",
          "gridPos": {"x":12,"y":24,"w":6,"h":4},
          "datasource": {"type":"prometheus","uid":"PBFA97CFB590B2093"},
          "targets": [{"expr":"sum(flask_http_request_total{job=\"alerts-dashboard\",status=~\"5..\"}) or vector(0)","legendFormat":"","refId":"A"}],
          "options": {"colorMode":"background","graphMode":"none","reduceOptions":{"calcs":["lastNotNull"]}},
          "fieldConfig": {"defaults":{"thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"red","value":1}]}}}
        },
        {
          "id": 64, "type": "stat", "title": "Dashboard — Uptime",
          "gridPos": {"x":18,"y":24,"w":6,"h":4},
          "datasource": {"type":"prometheus","uid":"PBFA97CFB590B2093"},
          "targets": [{"expr":"process_start_time_seconds{job=\"alerts-dashboard\"} or kube_deployment_status_replicas_available{namespace=\"plane-track\",deployment=\"alerts-dashboard\"} * 0","legendFormat":"","refId":"A"}],
          "options": {"colorMode":"value","graphMode":"none","reduceOptions":{"calcs":["lastNotNull"]}},
          "fieldConfig": {"defaults":{"unit":"dateTimeFromNow"}}
        },

        {
          "id": 65, "type": "timeseries", "title": "Dashboard — Requêtes/s par endpoint",
          "gridPos": {"x":0,"y":28,"w":12,"h":8},
          "datasource": {"type":"prometheus","uid":"PBFA97CFB590B2093"},
          "targets": [
            {"expr":"rate(flask_http_request_total{job=\"alerts-dashboard\",path=\"/api/alerts\"}[1m])","legendFormat":"GET /api/alerts","refId":"A"},
            {"expr":"rate(flask_http_request_total{job=\"alerts-dashboard\",path=\"/api/tracker\"}[1m])","legendFormat":"GET /api/tracker","refId":"B"},
            {"expr":"rate(flask_http_request_total{job=\"alerts-dashboard\",path=\"/api/raw\"}[1m])","legendFormat":"GET /api/raw","refId":"C"},
            {"expr":"rate(flask_http_request_total{job=\"alerts-dashboard\",path=\"/api/health\"}[1m])","legendFormat":"GET /api/health","refId":"D"},
            {"expr":"rate(flask_http_request_total{job=\"alerts-dashboard\",path=\"/\"}[1m])","legendFormat":"GET /","refId":"E"}
          ],
          "fieldConfig": {"defaults":{"unit":"reqps","custom":{"lineWidth":2},"color":{"mode":"palette-classic"}}}
        },
        {
          "id": 66, "type": "timeseries", "title": "Dashboard — Latence moyenne par endpoint (s)",
          "gridPos": {"x":12,"y":28,"w":12,"h":8},
          "datasource": {"type":"prometheus","uid":"PBFA97CFB590B2093"},
          "targets": [
            {"expr":"rate(flask_http_request_duration_seconds_sum{job=\"alerts-dashboard\",path=\"/api/alerts\"}[1m]) / rate(flask_http_request_duration_seconds_count{job=\"alerts-dashboard\",path=\"/api/alerts\"}[1m])","legendFormat":"latence /api/alerts","refId":"A"},
            {"expr":"rate(flask_http_request_duration_seconds_sum{job=\"alerts-dashboard\",path=\"/api/tracker\"}[1m]) / rate(flask_http_request_duration_seconds_count{job=\"alerts-dashboard\",path=\"/api/tracker\"}[1m])","legendFormat":"latence /api/tracker","refId":"B"},
            {"expr":"rate(flask_http_request_duration_seconds_sum{job=\"alerts-dashboard\",path=\"/api/raw\"}[1m]) / rate(flask_http_request_duration_seconds_count{job=\"alerts-dashboard\",path=\"/api/raw\"}[1m])","legendFormat":"latence /api/raw","refId":"C"}
          ],
          "fieldConfig": {"defaults":{"unit":"s","custom":{"lineWidth":2},"color":{"mode":"palette-classic"}}}
        },

        { "id": 70, "type": "row", "title": "\ud83d\udce6 Kafka — Consumer Lag & Taille topics", "gridPos": {"x":0,"y":36,"w":24,"h":1}, "collapsed": false },

        {
          "id": 71, "type": "timeseries", "title": "Kafka — Taille topics CEP (offsets / messages totaux)",
          "gridPos": {"x":0,"y":37,"w":24,"h":8},
          "datasource": {"type":"prometheus","uid":"PBFA97CFB590B2093"},
          "targets": [
            {"expr":"kafka_log_log_size{topic=\"adsb_raw\",namespace=\"plane-track\"}","legendFormat":"adsb_raw","refId":"A"},
            {"expr":"kafka_log_log_size{topic=\"ory_missed_approach\",namespace=\"plane-track\"}","legendFormat":"ory_missed_approach","refId":"B"},
            {"expr":"kafka_log_log_size{topic=\"ory_twin_landing\",namespace=\"plane-track\"}","legendFormat":"ory_twin_landing","refId":"C"},
            {"expr":"kafka_log_log_size{topic=\"ory_repeated_goaround\",namespace=\"plane-track\"}","legendFormat":"ory_repeated_goaround","refId":"D"},
            {"expr":"kafka_log_log_size{topic=\"ory_rapid_descent\",namespace=\"plane-track\"}","legendFormat":"ory_rapid_descent","refId":"E"},
            {"expr":"kafka_log_log_size{topic=\"ory_corridor_overload\",namespace=\"plane-track\"}","legendFormat":"ory_corridor_overload","refId":"F"}
          ],
          "fieldConfig": {"defaults":{"unit":"short","custom":{"lineWidth":1,"fillOpacity":8},"color":{"mode":"palette-classic"}}},
          "options": {"tooltip":{"mode":"multi"}}
        },

        {
          "id": 72, "type": "timeseries", "title": "Kafka — Consumer Lag dashboard (messages en attente par topic)",
          "gridPos": {"x":0,"y":45,"w":24,"h":8},
          "datasource": {"type":"prometheus","uid":"PBFA97CFB590B2093"},
          "targets": [
            {"expr":"kafka_consumergroup_lag{topic=\"ory_missed_approach\",namespace=\"plane-track\"} or kafka_consumer_lag_millis{topic=\"ory_missed_approach\",namespace=\"plane-track\"} / 1000","legendFormat":"lag ory_missed_approach","refId":"A"},
            {"expr":"kafka_consumergroup_lag{topic=\"ory_twin_landing\",namespace=\"plane-track\"}","legendFormat":"lag ory_twin_landing","refId":"B"},
            {"expr":"kafka_consumergroup_lag{topic=\"ory_repeated_goaround\",namespace=\"plane-track\"}","legendFormat":"lag ory_repeated_goaround","refId":"C"},
            {"expr":"kafka_consumergroup_lag{topic=\"ory_rapid_descent\",namespace=\"plane-track\"}","legendFormat":"lag ory_rapid_descent","refId":"D"},
            {"expr":"kafka_consumergroup_lag{topic=\"ory_corridor_overload\",namespace=\"plane-track\"}","legendFormat":"lag ory_corridor_overload","refId":"E"},
            {"expr":"kafka_consumergroup_lag{topic=\"adsb_raw\",namespace=\"plane-track\"}","legendFormat":"lag adsb_raw","refId":"F"}
          ],
          "fieldConfig": {"defaults":{"unit":"short","custom":{"lineWidth":2},"color":{"mode":"palette-classic"},
            "thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"orange","value":100},{"color":"red","value":1000}]}}},
          "options": {"tooltip":{"mode":"multi"}}
        },

        { "id": 19, "type": "row", "title": "\ud83d\udd04 Restarts par composant", "gridPos": {"x":0,"y":53,"w":24,"h":1}, "collapsed": false },

        {
          "id": 15, "type": "timeseries", "title": "Pod Restarts par composant",
          "gridPos": {"x":0,"y":54,"w":24,"h":8},
          "datasource": {"type":"prometheus","uid":"PBFA97CFB590B2093"},
          "targets": [
            {"expr":"kube_pod_container_status_restarts_total{namespace=\"plane-track\",container=\"broker\"}","legendFormat":"broker","refId":"A"},
            {"expr":"kube_pod_container_status_restarts_total{namespace=\"plane-track\",container=\"schema-registry\"}","legendFormat":"schema-registry","refId":"B"},
            {"expr":"kube_pod_container_status_restarts_total{namespace=\"plane-track\",container=\"flink-jobmanager\"}","legendFormat":"flink-jobmanager","refId":"C"},
            {"expr":"kube_pod_container_status_restarts_total{namespace=\"plane-track\",container=\"flink-taskmanager\"}","legendFormat":"flink-taskmanager","refId":"D"},
            {"expr":"kube_pod_container_status_restarts_total{namespace=\"plane-track\",container=\"adsb-producer\"}","legendFormat":"adsb-producer","refId":"E"},
            {"expr":"kube_pod_container_status_restarts_total{namespace=\"plane-track\",container=\"dashboard\"}","legendFormat":"alerts-dashboard","refId":"F"}
          ],
          "fieldConfig": {"defaults":{"unit":"short","custom":{"lineWidth":2},"color":{"mode":"palette-classic"}}}
        },

        { "id": 20, "type": "row", "title": "\ud83d\udcbe CPU & M\u00e9moire", "gridPos": {"x":0,"y":62,"w":24,"h":1}, "collapsed": false },

        {
          "id": 21, "type": "timeseries", "title": "CPU Usage — composants plane-track",
          "gridPos": {"x":0,"y":63,"w":12,"h":8},
          "datasource": {"type":"prometheus","uid":"PBFA97CFB590B2093"},
          "targets": [
            {"expr":"rate(container_cpu_usage_seconds_total{namespace=\"plane-track\",container!=\"\",container!=\"POD\"}[2m])","legendFormat":"{{container}}","refId":"A"}
          ],
          "fieldConfig": {"defaults":{"unit":"short","custom":{"lineWidth":1},"color":{"mode":"palette-classic"}}}
        },
