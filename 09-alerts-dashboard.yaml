      <div id="tab-about" class="tabcontent">
        <div class="about">

          <h2>ORY Plane-Track — CEP Pipeline</h2>
          <p class="subtitle">
            Real-time Complex Event Processing on ADS-B transponder data
            for Paris-Orly International Airport (IATA: ORY)
          </p>

          <!-- ── Use case ── -->
          <h3>🎯 Use Case</h3>
          <p>
            This platform demonstrates how to build a <strong>real-time aviation safety
            monitoring pipeline</strong> entirely from open-source components running on
            Kubernetes / OpenShift. It ingests live ADS-B position reports broadcast by
            aircraft transponders, enriches them, and applies streaming CEP rules to detect
            five abnormal flight patterns around Paris-Orly — the moment they occur, not
            minutes later.
          </p>
          <p>
            The same architecture applies to any domain that requires <strong>low-latency
            pattern detection over high-volume event streams</strong>: logistics (vehicle
            deviations), telecoms (network anomalies), finance (fraud sequences), or
            industrial IoT (machine fault signatures).
          </p>

          <!-- ── Alert types ── -->
          <h3>✈ Detected Patterns</h3>
          <div class="atype-grid">

            <div class="atype atype-ma">
              <h4>🔴 Missed Approach</h4>
              <p>
                An aircraft enters the ORY final approach corridor — below
                <strong>3 000 ft (914 m)</strong> with a descending vertical rate — then
                climbs away without touching down. This go-around manoeuvre must be
                detected within a <strong>10-minute event window</strong>.
              </p>
              <div class="thresholds">
                Pattern: <code>APPROACH → LEVEL* → CLIMBING</code><br>
                A: <code>alt &lt; 914 m · vrate &lt; -1 m/s · on_ground=F</code><br>
                B: <code>alt &lt; 914 m · vrate ≤ 2 m/s  · on_ground=F</code><br>
                C: <code>alt &gt; 200 m · vrate &gt; 2 m/s  · on_ground=F</code>
              </div>
            </div>

            <div class="atype atype-tw">
              <h4>🟡 Twin Landing (Simultaneous Finals)</h4>
              <p>
                Two <em>different</em> aircraft are both inside the short-final zone
                within overlapping <strong>HOP windows (90 s width, 10 s slide)</strong>. At a
                two-runway airport like ORY, this indicates a longitudinal separation
                violation that may warrant ATC intervention.
              </p>
              <div class="thresholds">
                Pattern: two distinct <code>icao24</code> values<br>
                both satisfying <code>alt &lt; 500 m · on_ground=F</code><br>
                within the same <code>HOP(90 s, 10 s)</code> window (self-join)
              </div>
            </div>

            <div class="atype atype-rga">
              <h4>🔁 Repeat Go-Around — Persistent Miss Detection</h4>
              <p>
                The <em>same</em> aircraft executes two missed approaches within a
                <strong>30-minute window</strong> — a rare and operationally significant
                pattern suggesting a persistent obstacle, a crew or systems issue, or
                severe weather blocking the runway. Detected by chaining a second
                missed-approach event onto the first via a self-join on the
                <code>ory_missed_approach</code> stream.
              </p>
              <div class="thresholds">
                Pattern: same <code>icao24</code> across two missed-approach events<br>
                <code>goaround_2 BETWEEN goaround_1 AND goaround_1 + 30 min</code><br>
                detected via CEP chaining on <code>ory_missed_approach</code>
              </div>
            </div>

            <div class="atype atype-rd">
              <h4>🔻 Rapid Descent — Emergency Descent Threshold</h4>
              <p>
                An airborne aircraft below <strong>2 000 m</strong> records a vertical
                rate exceeding <strong>−18 m/s (≈ 3 540 ft/min)</strong> — well above a
                normal approach rate and consistent with an emergency or uncontrolled
                descent. Detected by a threshold filter applied directly to the enriched
                ADS-B stream; no temporal pattern is required.
              </p>
              <div class="thresholds">
                <code>baro_altitude &lt; 2 000 m · on_ground=F</code><br>
                <code>vertical_rate &lt; −18 m/s</code>  (≈ 3 540 ft/min)<br>
                pure threshold — no event window
              </div>
            </div>

            <div class="atype atype-co">
              <h4>🔵 Corridor Overload — Approach Sector Saturation</h4>
              <p>
                Three or more <em>distinct</em> aircraft are simultaneously present
                inside the ORY approach corridor within the same
                <strong>30-second tumbling window</strong>. At a two-runway airport this
                indicates an unusually dense final approach sequence that may exceed
                ATC separation capacity.
              </p>
              <div class="thresholds">
                <code>COUNT(DISTINCT icao24) ≥ 3</code><br>
                all satisfying <code>alt &lt; 914 m · on_ground=F</code><br>
                within the same <code>TUMBLE(30 s)</code> window
              </div>
            </div>

          </div>

