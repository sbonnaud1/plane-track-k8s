          <ul>
            <li><strong>OpenSky Network</strong> — live ADS-B state vectors polled every 60 s
                for bounding box <code>48.10–49.15°N / 1.90–2.90°E</code> (±50 NM around ORY)</li>
            <li><strong>aircraft_lookup_fr.csv</strong> — French aircraft registry:
                maps <code>icao24</code> hex codes to airline, type, registration</li>
            <li><strong>flight_route_ory.csv</strong> — ORY route table:
                maps callsigns to origin–destination pairs</li>
            <li><strong>ADS-B Simulation</strong> — synthetic events with <code>icao24</code>
                prefixed <code>SIM*</code>; cycles MA → TW → RD → CO
                every 20 s to keep the dashboard active during low-traffic periods</li>
          </ul>

          <!-- ── Kubernetes resources ── -->
          <h3>☸ Kubernetes Workloads (<code>plane-track</code> namespace)</h3>
          <ul>
            <li><code>broker</code> — Kafka KRaft Deployment + ClusterIP Service (9092 / 29092)</li>
            <li><code>schema-registry</code> — Confluent Schema Registry
                (<code>enableServiceLinks: false</code> to avoid SCHEMA_REGISTRY_PORT injection)</li>
            <li><code>flink-jobmanager</code> — Flink JM, REST 9081, RPC 6123, BLOB 6124;
                includes <code>sql-resubmit-watchdog</code> sidecar that auto-submits all 5 CEP jobs</li>
            <li><code>flink-taskmanager</code> — 10 task slots</li>
            <li><code>adsb-producer</code> — polls OpenSky, publishes to <code>adsb_raw</code></li>
            <li><code>ADS-B Simulator</code> — synthetic <code>SIM*</code> events for demo / testing</li>
            <li><code>alerts-dashboard</code> — this Flask app, exposed via OpenShift Route (TLS edge)</li>
