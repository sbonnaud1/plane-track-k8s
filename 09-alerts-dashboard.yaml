---
# ConfigMap holding the alerts dashboard Flask application.
# Consumes all 5 CEP Kafka topics: ory_missed_approach, ory_twin_landing,
# ory_rapid_descent, ory_corridor_overload, ory_repeated_goaround.
# Serves a live web UI at port 8080 with an OpenShift Route.
apiVersion: v1
kind: ConfigMap
metadata:
  name: alerts-dashboard-script
  namespace: plane-track
data:
  app.py: |
    """
    alerts-dashboard / app.py
    Flask web UI that tails the CEP output Kafka topics and serves a
    live dashboard of ORY aviation alerts, split into:
      - LIVE section      : real OpenSky ADS-B data (icao24 NOT starting with "SIM")
      - SIMULATED section : events injected by adsb-simulator (icao24 starts with "SIM")

    Routes:
      GET /            → HTML dashboard
      GET /api/alerts  → JSON list of recent alerts (last 20, newest first)
      GET /api/raw     → JSON list of recent raw ADS-B vectors (last 200)
      GET /api/health  → JSON Flink job health {flink_status, job_id, job_name}
      GET /healthz     → liveness probe
    """
    import json
    import os
    import threading
    import time
    from collections import deque
    from datetime import datetime, timezone

    import requests as _requests

    from flask import Flask, jsonify, render_template_string

    from kafka import KafkaConsumer
    from kafka.errors import NoBrokersAvailable

    BOOTSTRAP  = os.environ.get("KAFKA_BOOTSTRAP", "broker:29092")
    FLINK_API  = os.environ.get("FLINK_API", "http://flink-jobmanager:9081")
    TOPICS     = ["ory_missed_approach", "ory_twin_landing",
                  "ory_repeated_goaround", "ory_rapid_descent", "ory_corridor_overload"]
    PORT       = int(os.environ.get("PORT", "8080"))
    MAX_ALERTS = 200
    MAX_RAW    = 200  # max raw ADS-B vectors kept in memory for Flight Events tab

    app = Flask(__name__)

    _alerts: deque = deque(maxlen=MAX_ALERTS)
    _raw:    deque = deque(maxlen=MAX_RAW)   # latest raw ADS-B vectors
    _lock          = threading.Lock()
    _seq           = 0   # monotonic alert counter — stable lookup key in the UI
    # Per-topic deduplication: suppress repeated alerts for the same aircraft/pair.
    # Key: (topic, canonical_id) → epoch of last accepted alert.
    _dedup_seen: dict = {}
    # TW uses HOP(90s, slide 10s) → up to 9 overlapping windows per event.
    # 300s cooldown ensures only 1 TW alert per aircraft pair per demo cycle.
    # Other topics: 90s is enough to absorb Flink re-emissions.
    _DEDUP_COOLDOWN_TW  = 300  # seconds — twin landing
    _DEDUP_COOLDOWN_DEF =  90  # seconds — all other topics
    _seek_event    = threading.Event()   # set by /sim/reset: alerts consumer must seek to end
    _seek_done     = threading.Event()   # set by alerts consumer after seek+clear complete
    _consumer_ref  = [None]              # holds live alerts KafkaConsumer so reset can seek it
    _raw_seek_event = threading.Event()  # set by /sim/reset: raw consumer must seek to end
    _raw_seek_done  = threading.Event()  # set by raw consumer after seek+clear complete
    _raw_consumer_ref = [None]           # holds live raw KafkaConsumer so reset can seek it

    def _is_simulated(alert: dict) -> bool:
        """Return True when all icao24 fields in the alert belong to the simulator."""
        for key in ("icao24", "icao24_a", "icao24_b"):
            val = alert.get(key, "")
            if val and not str(val).upper().startswith("SIM"):
                return False
        return True

    def _dedup_key(alert: dict):
        """Return a (topic, canonical_id) dedup key for any alert topic."""
        t = alert.get("_topic", "")
        if t == "ory_twin_landing":
            a = alert.get("icao24_a", "") or ""
            b = alert.get("icao24_b", "") or ""
            # Canonical order so (A,B) and (B,A) collapse to the same key
            return (t, tuple(sorted([a, b])))
        else:
            return (t, alert.get("icao24", "") or "")

    # ── Kafka consumer thread ────────────────────────────────────────────────
    def _consume():
        global _seq, _dedup_seen
        consumer = None
        while consumer is None:
            try:
                consumer = KafkaConsumer(
                    *TOPICS,
                    bootstrap_servers=BOOTSTRAP,
                    auto_offset_reset="earliest",
                    enable_auto_commit=False,
                    # No group_id — each pod start gets a fresh anonymous consumer.
                    # "earliest" replays existing alerts on restart so the dashboard
                    # is never empty after a pod reschedule.
                    value_deserializer=lambda m: json.loads(m.decode("utf-8", errors="replace")),
                    consumer_timeout_ms=1000,
                )
                _consumer_ref[0] = consumer
                print(f"[dashboard] Kafka consumer connected to {BOOTSTRAP}", flush=True)
            except NoBrokersAvailable:
                print("[dashboard] Kafka not ready — retrying in 5s", flush=True)
                time.sleep(5)

        while True:
            try:
                # If reset was requested: seek to end, wipe state, then signal done.
                if _seek_event.is_set():
                    consumer.seek_to_end()
                    with _lock:
                        _alerts.clear()
                        _dedup_seen.clear()
                        _seq = 0
                    _seek_event.clear()
                    _seek_done.set()
                    print("[dashboard] Consumer seeked to end and deque cleared", flush=True)

                for msg in consumer:
                    # Re-check seek flag between messages; break immediately if reset fires
                    if _seek_event.is_set():
                        break
                    alert = msg.value or {}
                    alert["_topic"]          = msg.topic
                    now_epoch                = time.time()
                    alert["_received_at"]    = datetime.fromtimestamp(now_epoch, tz=timezone.utc).strftime("%H:%M:%S UTC")
                    alert["_received_epoch"] = now_epoch
                    alert["_simulated"]      = _is_simulated(alert)
                    dk = _dedup_key(alert)
                    cooldown = _DEDUP_COOLDOWN_TW if alert.get("_topic") == "ory_twin_landing" else _DEDUP_COOLDOWN_DEF
                    with _lock:
                        last = _dedup_seen.get(dk)
                        if last and (now_epoch - last) < cooldown:
                            continue
                        _dedup_seen[dk] = now_epoch
                        _seq += 1
                        alert["_id"] = _seq
                        _alerts.appendleft(alert)
            except Exception as exc:
                print(f"[dashboard] Consumer error: {exc}", flush=True)
                time.sleep(2)

    _t = threading.Thread(target=_consume, daemon=True)
    _t.start()

    # ── Raw ADS-B consumer (adsb_raw → _raw deque) ───────────────────────────
    def _consume_raw():
        consumer = None
        while consumer is None:
            try:
                consumer = KafkaConsumer(
                    "adsb_raw",
                    bootstrap_servers=BOOTSTRAP,
                    auto_offset_reset="latest",
                    enable_auto_commit=False,
                    value_deserializer=lambda m: json.loads(m.decode("utf-8", errors="replace")),
                    consumer_timeout_ms=1000,
                )
                _raw_consumer_ref[0] = consumer
                print(f"[dashboard] Raw consumer connected to {BOOTSTRAP}", flush=True)
            except NoBrokersAvailable:
                time.sleep(5)
        while True:
            try:
                # If reset was requested: seek to end, wipe deque, then signal done.
                if _raw_seek_event.is_set():
                    consumer.seek_to_end()
                    with _lock:
                        _raw.clear()
                    _raw_seek_event.clear()
                    _raw_seek_done.set()
                    print("[dashboard] Raw consumer seeked to end and deque cleared", flush=True)

                for msg in consumer:
                    if _raw_seek_event.is_set():
                        break
                    v = msg.value or {}
                    v["_received_at"] = datetime.now(timezone.utc).strftime("%H:%M:%S UTC")
                    with _lock:
                        _raw.appendleft(v)
            except Exception as exc:
                print(f"[dashboard] Raw consumer error: {exc}", flush=True)
                time.sleep(2)

    threading.Thread(target=_consume_raw, daemon=True).start()

    # ── Flask routes ─────────────────────────────────────────────────────────
    @app.route("/healthz")
    def healthz():
        return "ok", 200

    @app.route("/api/alerts")
    def api_alerts():
        with _lock:
            return jsonify(list(_alerts))

    @app.route("/api/raw")
    def api_raw():
        with _lock:
            return jsonify(list(_raw))

    @app.route("/api/alert/<int:idx>")
    def api_alert(idx):
        with _lock:
            alerts = list(_alerts)
        if idx < 0 or idx >= len(alerts):
            return jsonify({"error": "not found"}), 404
        return jsonify(alerts[idx])

    @app.route("/api/health")
    def api_health():
        """Check if the Flink CEP job is running. Used by the dashboard header dot."""
        try:
            resp = _requests.get(f"{FLINK_API}/jobs/overview", timeout=3)
            jobs = resp.json().get("jobs", [])
            running = [j for j in jobs if j.get("state") == "RUNNING"]
            if running:
                j = running[0]
                return jsonify({"flink_status": "RUNNING",
                                "job_id": j.get("jid"), "job_name": j.get("name")})
            elif jobs:
                return jsonify({"flink_status": jobs[0].get("state", "UNKNOWN"),
                                "job_id": jobs[0].get("jid"), "job_name": jobs[0].get("name")})
            else:
                return jsonify({"flink_status": "NO_JOB"})
        except Exception as e:
            return jsonify({"flink_status": "ERROR", "detail": str(e)})

    # ── Aviation Flight Tracker — OpenSky proxy (ORY bounding box) ────────────
    _OPENSKY_TRACKER_URL = (
        "https://opensky-network.org/api/states/all"
        "?lamin=48.10&lomin=1.90&lamax=49.15&lomax=2.90"
    )
    _OPENSKY_TOKEN_URL = "https://auth.opensky-network.org/auth/realms/opensky-network/protocol/openid-connect/token"
    _tracker_cache: dict = {"states": [], "fetched_at": None, "error": None, "retry_after": None}
    _tracker_lock = threading.Lock()
    _tracker_token_cache: dict = {"access_token": None, "expires_at": 0.0}
    _tracker_token_lock = threading.Lock()

    _TRACKER_CLIENT_ID     = os.environ.get("OPENSKY_CLIENT_ID", "")
    _TRACKER_CLIENT_SECRET = os.environ.get("OPENSKY_CLIENT_SECRET", "")
    _TRACKER_CREDS_FILE    = os.environ.get("OPENSKY_CREDENTIALS_FILE", "/etc/opensky/credentials.json")
    if (not _TRACKER_CLIENT_ID) and os.path.exists(_TRACKER_CREDS_FILE):
        try:
            _creds = json.loads(open(_TRACKER_CREDS_FILE).read())
            _TRACKER_CLIENT_ID     = _creds.get("clientId", "")
            _TRACKER_CLIENT_SECRET = _creds.get("clientSecret", "")
        except Exception:
            pass

    def _tracker_get_token():
        if not _TRACKER_CLIENT_ID:
            return None
        with _tracker_token_lock:
            now = time.time()
            if _tracker_token_cache["access_token"] and now < _tracker_token_cache["expires_at"] - 30:
                return _tracker_token_cache["access_token"]
            resp = _requests.post(
                _OPENSKY_TOKEN_URL,
                data={"grant_type": "client_credentials",
                      "client_id": _TRACKER_CLIENT_ID,
                      "client_secret": _TRACKER_CLIENT_SECRET},
                timeout=15,
            )
            resp.raise_for_status()
            tok = resp.json()
            _tracker_token_cache["access_token"] = tok["access_token"]
            _tracker_token_cache["expires_at"]   = now + tok.get("expires_in", 300)
            return _tracker_token_cache["access_token"]

    def _tracker_fetch_loop():
        backoff = 0
        while True:
            try:
                token = _tracker_get_token()
                headers = {"Authorization": f"Bearer {token}"} if token else {}
                resp = _requests.get(_OPENSKY_TRACKER_URL, timeout=20, headers=headers)
                if resp.status_code == 429:
                    backoff += 1
                    delay = min(60 * (2 ** backoff), 600)
                    retry_at = datetime.now(timezone.utc).timestamp() + delay
                    with _tracker_lock:
                        _tracker_cache["error"] = f"Rate limit OpenSky (429) — retry in {delay}s"
                        _tracker_cache["retry_after"] = retry_at
                    time.sleep(delay)
                    continue
                resp.raise_for_status()
                data  = resp.json()
                states = data.get("states") or []
                backoff = 0
                with _tracker_lock:
                    _tracker_cache["states"]      = states
                    _tracker_cache["fetched_at"]  = datetime.now(timezone.utc).strftime("%H:%M:%S UTC")
                    _tracker_cache["error"]       = None
                    _tracker_cache["retry_after"] = None
            except Exception as exc:
                with _tracker_lock:
                    _tracker_cache["error"]      = str(exc)
                    _tracker_cache["fetched_at"] = datetime.now(timezone.utc).strftime("%H:%M:%S UTC")
            time.sleep(60)

    threading.Thread(target=_tracker_fetch_loop, daemon=True).start()

    @app.route("/api/tracker")
    def api_tracker():
        with _tracker_lock:
            return jsonify({
                "states":      _tracker_cache["states"],
                "fetched_at":  _tracker_cache["fetched_at"],
                "error":       _tracker_cache["error"],
                "retry_after": _tracker_cache["retry_after"],
            })

    _LEAFLET_JS = None  # cached on first read

    @app.route("/static/leaflet.js")
    def static_leaflet():
        """Serve the Leaflet 1.9.4 bundle from the aviation-tracker app.py
        so the tracker tab can load it without internet access."""
        global _LEAFLET_JS
        from flask import Response
        if _LEAFLET_JS is None:
            try:
                # Attempt to load from aviation-tracker on same cluster
                r = _requests.get(
                    "http://aviation-tracker.test-app.svc.cluster.local:8080/static/leaflet.js",
                    timeout=5)
                if r.ok:
                    _LEAFLET_JS = r.text
            except Exception:
                pass
        if _LEAFLET_JS:
            return Response(_LEAFLET_JS, mimetype="application/javascript",
                            headers={"Cache-Control": "public, max-age=86400"})
        return Response("// Leaflet not available", mimetype="application/javascript"), 503

    # ── Simulator control routes ──
    def _scale_simulator(replicas):
        """Scale adsb-simulator deployment via the in-cluster Kubernetes API.
        Raises RuntimeError with a human-readable message on failure."""
        token_path = "/var/run/secrets/kubernetes.io/serviceaccount/token"
        ca         = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
        try:
            token = open(token_path).read().strip()
        except OSError as e:
            raise RuntimeError(f"Cannot read SA token: {e}")
        url = ("https://kubernetes.default.svc/apis/apps/v1"
               "/namespaces/plane-track/deployments/adsb-simulator/scale")
        try:
            resp = _requests.patch(
                url,
                headers={"Authorization": "Bearer " + token,
                         "Content-Type": "application/merge-patch+json"},
                data=json.dumps({"spec": {"replicas": replicas}}),
                verify=ca,
                timeout=10,
            )
        except Exception as e:
            raise RuntimeError(f"K8s PATCH failed: {e}")
        if not resp.ok:
            raise RuntimeError(f"K8s returned {resp.status_code}: {resp.text[:200]}")

    @app.route("/sim/start", methods=["POST"])
    def sim_start():
        global _seq
        # Stop simulator first (force fresh pod even if already running).
        try:
            _scale_simulator(0)
        except RuntimeError as e:
            print(f"[dashboard] sim/start (scale-down) error: {e}", flush=True)
            return jsonify({"status": "error", "message": str(e)}), 500

        # Seek consumer to end + clear deque so Start always shows only new alerts.
        _seek_done.clear()
        _seek_event.set()
        if not _seek_done.wait(timeout=3.0):
            with _lock:
                _alerts.clear()
                _seq = 0
            _seek_event.clear()

        try:
            _scale_simulator(1)
            return jsonify({"status": "started"})
        except RuntimeError as e:
            print(f"[dashboard] sim/start (scale-up) error: {e}", flush=True)
            return jsonify({"status": "error", "message": str(e)}), 500

    @app.route("/sim/stop", methods=["POST"])
    def sim_stop():
        try:
            _scale_simulator(0)
            return jsonify({"status": "stopped"})
        except RuntimeError as e:
            print(f"[dashboard] sim/stop error: {e}", flush=True)
            return jsonify({"status": "error", "message": str(e)}), 500

    @app.route("/sim/reset", methods=["POST"])
    def sim_reset():
        global _seq
        # 1. Stop simulator so no new Kafka events arrive during the wipe
        try:
            _scale_simulator(0)
        except RuntimeError as e:
            return jsonify({"status": "error", "message": f"stop failed: {e}"}), 500

        # 2. Signal both consumer threads simultaneously to seek to end + clear their deques.
        #    Both events are set before waiting so both consumers start seeking in parallel.
        #    We wait for both done-events with a shared 3 s deadline.
        _seek_done.clear()
        _raw_seek_done.clear()
        _seek_event.set()       # signal alerts consumer
        _raw_seek_event.set()   # signal raw consumer — both now seeking in parallel

        if not _seek_done.wait(timeout=3.0):
            # Alerts consumer didn't acknowledge in time — clear directly as fallback
            with _lock:
                _alerts.clear()
                _seq = 0
            _seek_event.clear()

        if not _raw_seek_done.wait(timeout=3.0):
            # Raw consumer didn't acknowledge in time — clear directly as fallback
            with _lock:
                _raw.clear()
            _raw_seek_event.clear()

        # 3. Restart simulator
        try:
            _scale_simulator(1)
        except RuntimeError as e:
            return jsonify({"status": "error", "message": f"restart failed: {e}"}), 500
        return jsonify({"status": "reset"})

    _HTML = """<!--HTML_START--><!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width,initial-scale=1">
      <title>ORY CEP Alerts Dashboard</title>
      <style>
        *, *::before, *::after { box-sizing: border-box; }
        body   { font-family: 'Segoe UI', sans-serif; background:#0d1117; color:#e6edf3; margin:0; padding:0; }

        /* ── Header ── */
        header { background:#161b22; padding:12px 24px; border-bottom:2px solid #21262d;
                 display:flex; align-items:center; gap:16px; }
        header h1  { margin:0; font-size:19px; color:#e6edf3; flex:1; }
        .hdr-meta  { font-size:12px; color:#8b949e; white-space:nowrap; }
        .hdr-dot   { display:inline-block; width:8px; height:8px; border-radius:50%;
                     background:#3fb950; margin-right:5px; transition:background .4s; }
        .hdr-dot.warn  { background:#d29922; }
        .hdr-dot.error { background:#f85149; }

        /* ── Tab bar ── */
        .tabbar { background:#161b22; border-bottom:1px solid #21262d;
                  display:flex; gap:0; padding:0 24px; }
        .tab    { padding:10px 18px; font-size:14px; color:#8b949e; cursor:pointer;
                  border-bottom:2px solid transparent; margin-bottom:-1px;
                  user-select:none; white-space:nowrap; position:relative; }
        .tab:hover  { color:#e6edf3; }
        .tab.active { color:#58a6ff; border-bottom-color:#58a6ff; }
        /* alert count badge on tab */
        .tab-badge { display:inline-block; margin-left:6px; background:#f85149;
                     color:#fff; border-radius:10px; padding:1px 6px;
                     font-size:11px; font-weight:700; vertical-align:middle;
                     min-width:18px; text-align:center; }
        .tab-badge.empty { display:none; }

        /* ── Tab content ── */
        .tabcontent       { display:none; }
        .tabcontent.active{ display:block; }

        /* ── Single-panel alerts layout ── */
        .panel       { padding:18px 20px; min-height:calc(100vh - 130px); }
        .panel-live  { background:#0f1318; }
        .panel-sim   { background:#161b22; }
        .panel-title     { display:flex; align-items:center; gap:10px;
                           margin-bottom:14px; padding-bottom:10px;
                           border-bottom:1px solid #21262d; }
        .panel-title h2  { margin:0; font-size:15px; font-weight:600; }
        .panel-title .count { font-size:12px; color:#8b949e;
                              background:#21262d; border-radius:10px;
                              padding:1px 8px; }
        .panel-live .panel-title h2 { color:#58a6ff; }
        .live-dot { display:inline-block; width:8px; height:8px; border-radius:50%;
                    background:#3fb950; margin-right:6px; box-shadow:0 0 6px #3fb950; }
        .panel-sim .panel-title h2  { color:#bc8cff; }
        .sim-icon { margin-right:6px; font-size:14px; }
        .sim-banner { background:#1e1433; border:1px solid #6e40c9; border-radius:6px;
                      padding:8px 12px; margin-bottom:14px; font-size:11px; color:#bc8cff; }

        /* ── Alert cards ── */
        .card        { border-radius:6px; padding:8px 12px; margin-bottom:6px;
                       border-left:3px solid transparent; }
        .card-missed { background:#1a0d0d; border-color:#f85149; }
        .card-twin   { background:#1a1500; border-color:#d29922; }
        .card-rga    { background:#0d1a1a; border-color:#ff7b72; }
        .card-rd     { background:#1a0a00; border-color:#ff6b35; }
        .card-co     { background:#0d1a2a; border-color:#79c0ff; }
        .panel-sim .card-missed { background:#130d0d; border-color:#7a3c3a; }
        .panel-sim .card-twin   { background:#13120a; border-color:#6b5a1a; }
        .panel-sim .card-rga    { background:#0a1212; border-color:#5a3030; }
        .panel-sim .card-rd     { background:#130800; border-color:#7a4020; }
        .panel-sim .card-co     { background:#0a1220; border-color:#304060; }
        .card-header { display:none; }
        .card-footer { display:none; }
        .badge { display:inline-block; padding:2px 7px; border-radius:4px;
                 font-size:11px; font-weight:700; letter-spacing:.3px; }
        .badge-missed { background:#f85149; color:#fff; }
        .badge-twin   { background:#d29922; color:#fff; }
        .badge-rga    { background:#ff7b72; color:#0d1117; }
        .badge-rd     { background:#ff6b35; color:#0d1117; }
        .badge-co     { background:#79c0ff; color:#0d1117; }
        .panel-sim .badge-missed { background:#7a3c3a; }
        .panel-sim .badge-twin   { background:#6b5a1a; }
        .panel-sim .badge-rga    { background:#5a3030; color:#e6edf3; }
        .panel-sim .badge-rd     { background:#7a4020; color:#e6edf3; }
        .panel-sim .badge-co     { background:#304060; color:#e6edf3; }
        .card-line1 { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
        .card-line2 { display:contents; }
        .card-body  { font-size:13px; line-height:1.4; flex:1; min-width:0; }
        .card-body strong { color:#e6edf3; }
        .card-body .muted { color:#8b949e; font-size:12px; }
        .card-ts    { font-size:11px; color:#8b949e; }
        .card-age   { font-size:11px; color:#57606a; }
        .card-sep   { font-size:11px; color:#30363d; }
        .details-link { font-size:12px; color:#58a6ff; cursor:pointer;
                        background:none; border:none; padding:0;
                        text-decoration:underline; text-underline-offset:2px; }
        .details-link:hover { color:#79c0ff; }
        .empty { color:#8b949e; font-size:12px; padding:20px 0; text-align:center; }
        /* ── New card pulse animation ── */
        @keyframes card-pulse {
          0%   { box-shadow: 0 0 0 0 rgba(88,166,255,.5); }
          60%  { box-shadow: 0 0 0 8px rgba(88,166,255,0); }
          100% { box-shadow: 0 0 0 0 rgba(88,166,255,0); }
        }
        .card-new { animation: card-pulse 1.4s ease-out 2; }

        /* ── Slide-over drawer ── */
        .drawer-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.55);
