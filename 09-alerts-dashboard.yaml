          <!-- Go-around #1: descend then climb -->
          <polyline points="20,22 55,42 75,58 90,70 100,60 112,38 122,22"
                    fill="none" stroke="#ff7b72" stroke-width="2"/>
          <circle cx="20"  cy="22" r="3" fill="#ff7b72"/>
          <circle cx="122" cy="22" r="3" fill="#ff7b72"/>
          <text x="68" y="76" fill="#ff7b72" text-anchor="middle" font-size="8">miss #1</text>
          <!-- Go-around #2: later, same aircraft -->
          <polyline points="158,22 193,42 213,58 228,70 238,60 250,38 262,22"
                    fill="none" stroke="#ffadad" stroke-width="2" stroke-dasharray="5,3"/>
          <circle cx="158" cy="22" r="3" fill="#ffadad"/>
          <circle cx="262" cy="22" r="3" fill="#ffadad"/>
          <text x="210" y="76" fill="#ffadad" text-anchor="middle" font-size="8">miss #2</text>
        </svg>
        <div class="pop-rules">
          Same icao24 across two missed-approach events<br>
          goaround_2 BETWEEN goaround_1 AND goaround_1 + 30 min<br>
          detected via CEP chaining on ory_missed_approach
        </div>
      </div>

      <!-- Rapid Descent popover -->
      <div class="popover" id="pop-rd">
        <h4 style="color:#ff6b35">🔻 Rapid Descent — Emergency Descent Threshold</h4>
        <p>An airborne aircraft below <strong>2 000 m</strong> records a vertical rate exceeding <strong>−18 m/s (≈ 3 540 ft/min)</strong> — well above a normal approach rate and consistent with an emergency or uncontrolled descent. Detected by a threshold filter applied directly to the enriched ADS-B stream; no temporal pattern is required.</p>
        <svg width="288" height="110" viewBox="0 0 288 110" font-family="Segoe UI,sans-serif" font-size="9" style="display:block;margin:8px 0">
          <!-- ground -->
          <rect x="10" y="88" width="268" height="6" rx="2" fill="#21262d"/>
          <text x="144" y="104" fill="#8b949e" text-anchor="middle">Ground level</text>
          <!-- 2000 m ceiling -->
          <line x1="10" y1="12" x2="278" y2="12" stroke="#30363d" stroke-dasharray="4,3" stroke-width="1"/>
          <text x="281" y="15" fill="#8b949e">2 000 m</text>
          <!-- threshold line at −15 m/s annotation -->
          <line x1="10" y1="50" x2="278" y2="50" stroke="#ff6b35" stroke-dasharray="3,3" stroke-width="1"/>
          <text x="12" y="47" fill="#ff6b35" font-size="8">−18 m/s threshold</text>
          <!-- normal descent (shallow, grey) -->
          <polyline points="20,14 120,55 180,72 240,84"
                    fill="none" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4,3"/>
          <text x="60" y="26" fill="#8b949e" font-size="8">normal</text>
          <!-- rapid descent (steep, orange) -->
          <polyline points="120,14 155,38 175,58 195,75 210,84"
                    fill="none" stroke="#ff6b35" stroke-width="2.5"/>
          <circle cx="120" cy="14" r="4" fill="#ff6b35"/>
          <circle cx="195" cy="75" r="4" fill="#ff6b35"/>
          <text x="220" y="38" fill="#ff6b35" font-size="8">rapid ↓</text>
          <!-- alert flash marker -->
          <circle cx="155" cy="38" r="5" fill="none" stroke="#ff6b35" stroke-width="1.5"/>
          <text x="164" y="42" fill="#ff6b35" font-size="8">⚡</text>
        </svg>
        <div class="pop-rules">
          baro_altitude &lt; 2 000 m · not on ground<br>
          vertical_rate &lt; −18 m/s  (≈ 3 540 ft/min)<br>
          pure threshold — no event window
        </div>
      </div>

      <!-- Corridor Overload popover -->
      <div class="popover" id="pop-co">
        <h4 style="color:#79c0ff">🔵 Corridor Overload — Approach Sector Saturation</h4>
        <p>Three or more <em>distinct</em> aircraft are simultaneously present inside the ORY approach corridor within the same <strong>30-second tumbling window</strong>. At a two-runway airport this indicates an unusually dense final approach sequence that may exceed ATC separation capacity.</p>
        <svg width="288" height="110" viewBox="0 0 288 110" font-family="Segoe UI,sans-serif" font-size="9" style="display:block;margin:8px 0">
          <!-- runway -->
          <rect x="10" y="88" width="268" height="6" rx="2" fill="#21262d"/>
          <text x="144" y="104" fill="#8b949e" text-anchor="middle">Runway 06/24</text>
          <!-- approach ceiling -->
          <line x1="10" y1="18" x2="278" y2="18" stroke="#30363d" stroke-dasharray="4,3" stroke-width="1"/>
          <text x="281" y="21" fill="#8b949e">914 m</text>
          <!-- 5-min window bracket -->
          <rect x="30" y="6" width="228" height="78" rx="4" fill="none" stroke="#79c0ff" stroke-width="1" stroke-dasharray="4,3"/>
          <text x="144" y="14" fill="#79c0ff" text-anchor="middle" font-size="8">TUMBLE 30 s — 3+ inside</text>
          <!-- Aircraft A -->
          <polyline points="35,16 100,36 170,58 230,78 268,86"
                    fill="none" stroke="#58a6ff" stroke-width="2"/>
          <circle cx="35"  cy="16" r="3" fill="#58a6ff"/>
          <text x="40" y="28" fill="#58a6ff">A</text>
          <!-- Aircraft B -->
          <polyline points="60,14 125,32 195,52 250,72 275,83"
                    fill="none" stroke="#bc8cff" stroke-width="2" stroke-dasharray="5,3"/>
          <circle cx="60"  cy="14" r="3" fill="#bc8cff"/>
          <text x="65" y="26" fill="#bc8cff">B</text>
          <!-- Aircraft C -->
          <polyline points="90,12 155,28 215,48 258,66"
                    fill="none" stroke="#79c0ff" stroke-width="2" stroke-dasharray="2,3"/>
          <circle cx="90"  cy="12" r="3" fill="#79c0ff"/>
          <text x="95" y="24" fill="#79c0ff">C</text>
        </svg>
        <div class="pop-rules">
          COUNT(DISTINCT icao24) ≥ 3<br>
          all satisfying: baro_altitude &lt; 914 m · not on ground<br>
          within the same TUMBLE(30 s) window
        </div>
      </div>

      <!-- ══════════════════════ DRAWER ══════════════════════ -->
      <div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>
      <div class="drawer" id="drawer">
        <div class="drawer-header">
          <h2 id="drawerTitle">Alert Details</h2>
          <button class="drawer-close" onclick="closeDrawer()">✕</button>
        </div>
        <div class="drawer-body" id="drawerBody">
          <p class="loading">Loading…</p>
        </div>
      </div>

      <script>
        /* ── Tab switching ── */
        function showTab(name) {
          document.querySelectorAll('.tabcontent').forEach(function(t){ t.classList.remove('active'); });
          document.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('active'); });
          document.getElementById('tab-' + name).classList.add('active');
          document.getElementById('tab-btn-' + name).classList.add('active');
        }

        /* ── Per-panel active filter state ── */
        var _filter = { sim: 'all', live: 'all' };

        /* ── Filter chip click handler ── */
        document.querySelectorAll('.fchip[data-filter]').forEach(function(chip) {
          chip.addEventListener('click', function(e) {
            // Don't trigger filter when clicking the ? info button
            if (e.target.classList.contains('fchip-info')) return;
            var panel  = chip.dataset.panel;
            var filter = chip.dataset.filter;
            _filter[panel] = filter;
            // Update active state within this panel's bar
            document.querySelectorAll('.fchip[data-panel="' + panel + '"]').forEach(function(c) {
              c.classList.toggle('active', c.dataset.filter === filter);
            });
            renderCards(_alertsData);
          });
        });

        /* ── Popover logic (? info buttons) ── */
        var _openPop = null;
        document.querySelectorAll('.fchip-info').forEach(function(btn) {
          btn.addEventListener('click', function(e) {
            e.stopPropagation();
            var popId = btn.dataset.pop;
            var pop   = document.getElementById(popId);
            if (!pop) return;
            if (_openPop && _openPop !== pop) { _openPop.classList.remove('open'); }
            if (pop.classList.contains('open')) {
              pop.classList.remove('open');
              _openPop = null;
              return;
            }
            // Position near the button, avoid viewport edge
            var r = btn.getBoundingClientRect();
            var left = Math.min(r.left, window.innerWidth - 340);
            var top  = r.bottom + 6;
            if (top + 300 > window.innerHeight) top = r.top - 306;
            pop.style.left = left + 'px';
            pop.style.top  = top  + 'px';
            pop.classList.add('open');
            _openPop = pop;
          });
        });
        document.addEventListener('click', function() {
          if (_openPop) { _openPop.classList.remove('open'); _openPop = null; }
        });

        /* ── In-memory alert cache (updated by poll) ── */
        var _alertsData = [];
        /* Track highest _id seen so we know which cards are new since last render */
        var _lastSeenId = 0;

        /* ── Topic → card/badge/filter key mapping ── */
        var _TOPIC_META = {
          'ory_missed_approach':   { cls:'card-missed', badge:'badge-missed', key:'ma', label:'🔴 MISSED APPROACH' },
          'ory_twin_landing':      { cls:'card-twin',   badge:'badge-twin',   key:'tw', label:'🟡 TWIN LANDING' },
          'ory_repeated_goaround': { cls:'card-rga',    badge:'badge-rga',    key:'rga',label:'🔁 REPEAT GO-AROUND' },
          'ory_rapid_descent':     { cls:'card-rd',     badge:'badge-rd',     key:'rd', label:'🔻 RAPID DESCENT' },
          'ory_corridor_overload': { cls:'card-co',     badge:'badge-co',     key:'co', label:'🔵 CORRIDOR OVERLOAD' },
        };

        /* ── Interleave all topic buckets round-robin ── */
        function interleave(alerts) {
          var buckets = {}, order = ['ory_missed_approach','ory_twin_landing',
            'ory_repeated_goaround','ory_rapid_descent','ory_corridor_overload'];
          order.forEach(function(t){ buckets[t] = []; });
          alerts.forEach(function(a){
            if (buckets[a._topic]) buckets[a._topic].push(a);
            else buckets['ory_missed_approach'].push(a); // fallback
          });
          var out = [], more = true;
          while (more) {
            more = false;
            order.forEach(function(t){
              if (buckets[t].length) { out.push(buckets[t].shift()); more = true; }
            });
          }
          return out;
        }

        /* ── Apply topic filter for a panel ── */
        function applyFilter(alerts, panel) {
          var f = _filter[panel];
          if (f === 'all') return alerts;
          return alerts.filter(function(a){
            var meta = _TOPIC_META[a._topic];
            return meta && meta.key === f;
          });
        }

        /* ── Age string: "5 s ago", "2 min ago" etc. ── */
        function ageStr(epoch) {
          if (!epoch) return '';
          var secs = Math.round(Date.now() / 1000 - epoch);
          if (secs < 5)   return 'just now';
          if (secs < 60)  return secs + ' s ago';
          if (secs < 3600) return Math.floor(secs / 60) + ' min ago';
          return Math.floor(secs / 3600) + ' h ago';
        }

        /* ── Render alert cards into the two panel divs ── */
        function renderCards(alerts) {
          // Twin Landing is excluded from Live: at a dual-runway airport like Orly, two
          // aircraft simultaneously on parallel finals is normal operations, not an anomaly.
          // It is kept in Simulated where it demonstrates the CEP pattern as intended.
          var liveAll = interleave(alerts.filter(function(a){
            return !a._simulated && a._topic !== 'ory_twin_landing';
          }));
          var simAll  = interleave(alerts.filter(function(a){ return  a._simulated; }));
          var live = applyFilter(liveAll, 'live');
          var sim  = applyFilter(simAll,  'sim');

          document.getElementById('count-live').textContent = live.length + ' event(s)';
          document.getElementById('count-sim').textContent  = sim.length  + ' event(s)';

          document.getElementById('panel-live-cards').innerHTML =
            live.length ? live.map(cardHTML).join('') : '<p class="empty">No live alerts yet — waiting for real ORY traffic…</p>';
          document.getElementById('panel-sim-cards').innerHTML =
            sim.length  ? sim.map(cardHTML).join('')  : '<p class="empty">No simulated alerts yet — simulator starting up…</p>';

          /* Wire details buttons after injecting HTML */
          document.querySelectorAll('button.details-link').forEach(function(btn) {
            btn.addEventListener('click', function() {
              openDrawer(parseInt(btn.dataset.id, 10));
            });
          });

          /* Update tab badges — separate counts per panel */
          var badgeSim  = document.getElementById('tab-badge-sim');
          var badgeLive = document.getElementById('tab-badge-live');
          if (badgeSim)  { badgeSim.textContent  = sim.length;  badgeSim.classList.toggle('empty',  sim.length  === 0); }
          if (badgeLive) { badgeLive.textContent = live.length; badgeLive.classList.toggle('empty', live.length === 0); }
        }

        function cardHTML(a) {
          var meta = _TOPIC_META[a._topic] || _TOPIC_META['ory_missed_approach'];
          var isNew   = a._id > _lastSeenId;
          var newCls  = isNew ? ' card-new' : '';
          var ts      = a._received_at || '';
          var age     = a._received_epoch ? '<span class="card-age" data-epoch="' + a._received_epoch + '">' + ageStr(a._received_epoch) + '</span>' : '';
          var body    = '';
          var topic   = a._topic;

          if (topic === 'ory_missed_approach') {
            var cs  = a.callsign || a.icao24 || '—';
            var alt = a.approach_alt != null ? Math.round(a.approach_alt) + ' m' : '—';
            var vr  = a.go_around_alt != null ? Math.round(a.go_around_alt) + ' m' : '—';
            body = '<strong>' + cs + '</strong>' +
              ' <span class="muted">approach ' + alt + ' · go-around ' + vr + '</span>';
          } else if (topic === 'ory_twin_landing') {
            var csA = a.callsign_a || a.icao24_a || '—';
            var csB = a.callsign_b || a.icao24_b || '—';
            var altA = a.alt_a != null ? Math.round(a.alt_a) + ' m' : '—';
            var altB = a.alt_b != null ? Math.round(a.alt_b) + ' m' : '—';
            body = '<strong>' + csA + '</strong> &amp; <strong>' + csB + '</strong>' +
              ' <span class="muted">alts ' + altA + ' / ' + altB + '</span>';
          } else if (topic === 'ory_repeated_goaround') {
            var cs2 = a.callsign || a.icao24 || '—';
            var t1  = a.goaround_1 ? a.goaround_1.slice(11,16) : '—';
            var t2  = a.goaround_2 ? a.goaround_2.slice(11,16) : '—';
            body = '<strong>' + cs2 + '</strong>' +
              ' <span class="muted">go-arounds at ' + t1 + ' &amp; ' + t2 + '</span>';
          } else if (topic === 'ory_rapid_descent') {
            var cs3  = a.callsign || a.icao24 || '—';
            var alt3 = a.baro_altitude != null ? Math.round(a.baro_altitude) + ' m' : '—';
            var vr3  = a.vertical_rate != null ? a.vertical_rate.toFixed(1) + ' m/s' : '—';
            body = '<strong>' + cs3 + '</strong>' +
              ' <span class="muted">alt ' + alt3 + ' · vrate ' + vr3 + '</span>';
          } else if (topic === 'ory_corridor_overload') {
            var cnt = a.aircraft_count || '?';
            var ws  = a.window_start ? a.window_start.slice(11,16) : '—';
            var we  = a.window_end   ? a.window_end.slice(11,16)   : '—';
            body = '<strong>' + cnt + ' aircraft</strong>' +
              ' <span class="muted">in corridor ' + ws + '–' + we + '</span>';
          }

          return '<div class="card ' + meta.cls + newCls + '">' +
            '<div class="card-line1">' +
              '<span class="badge ' + meta.badge + '">' + meta.label + '</span>' +
              '<span class="card-body">' + body + '</span>' +
              '<span class="card-ts">' + ts + '</span>' +
              age +
              '<span class="card-sep">·</span>' +
              '<button class="details-link" data-id="' + a._id + '">View details →</button>' +
            '</div>' +
          '</div>';
        }

        /* ── Age counter — tick every second to update all visible age spans ── */
        setInterval(function() {
          document.querySelectorAll('.card-age[data-epoch]').forEach(function(el) {
            el.textContent = ageStr(parseFloat(el.dataset.epoch));
          });
        }, 1000);

        /* ── Flight Events raw polling ── */
        var _rawPollTimer = null;
        function pollRaw() {
          fetch('/api/raw')
            .then(function(r){ return r.json(); })
            .then(function(data){ renderRaw(data); })
            .catch(function(){});
        }
        function renderRaw(rows) {
          var tbody = document.getElementById('ev-tbody');
          if (!tbody) return;
          if (!rows || rows.length === 0) {
            tbody.innerHTML = '<tr><td colspan="10" style="padding:30px;text-align:center;color:#8b949e">No data yet — waiting for ADS-B vectors…</td></tr>';
            document.getElementById('ev-count').textContent   = '—';
            document.getElementById('ev-approach').textContent = '—';
            document.getElementById('ev-ground').textContent  = '—';
            document.getElementById('ev-ts').textContent      = '—';
            return;
          }
          var tracked  = rows.length;
          var approach = rows.filter(function(r){ return r.baro_altitude != null && r.baro_altitude < 914 && !r.on_ground; }).length;
          var ground   = rows.filter(function(r){ return r.on_ground; }).length;
          document.getElementById('ev-count').textContent   = tracked;
          document.getElementById('ev-approach').textContent = approach;
          document.getElementById('ev-ground').textContent  = ground;
          document.getElementById('ev-ts').textContent      = rows[0]._received_at || '—';

          /* Build icao24 → alert-type map from current alerts for row highlighting */
          var alertIcao = {};
          _alertsData.forEach(function(a) {
            var ids = [a.icao24, a.icao24_a, a.icao24_b].filter(Boolean);
            ids.forEach(function(id) {
              /* Priority: MA > RD > RGA > TW > CO */
              var existing = alertIcao[id];
              var t = a._topic;
              if (!existing ||
                  (t === 'ory_missed_approach') ||
                  (t === 'ory_rapid_descent'   && existing !== 'ory_missed_approach') ||
                  (t === 'ory_repeated_goaround' && existing !== 'ory_missed_approach' && existing !== 'ory_rapid_descent')) {
                alertIcao[id] = t;
              }
            });
          });

          function rowHighlight(icao24) {
            var t = alertIcao[icao24];
            if (!t) return '';
            if (t === 'ory_missed_approach' || t === 'ory_rapid_descent' || t === 'ory_repeated_goaround')
              return 'background:rgba(248,81,73,.10) !important;';
            if (t === 'ory_twin_landing' || t === 'ory_corridor_overload')
              return 'background:rgba(210,153,34,.08) !important;';
            return '';
          }

          function fmt(v, dec) {
            if (v == null) return '<span style="color:#57606a">—</span>';
            return parseFloat(v).toFixed(dec != null ? dec : 0);
          }
          function mToFt(m) { return m != null ? Math.round(m * 3.28084) + ' ft' : ''; }
          function msToKt(ms) { return ms != null ? Math.round(ms * 1.94384) : null; }

          function altStyle(r) {
            if (r.on_ground) return 'color:#3fb950';
            if (r.baro_altitude != null && r.baro_altitude < 914) return 'color:#f85149;font-weight:600';
            return 'color:#e6edf3';
          }
          function vrStyle(v) {
            if (v == null) return '';
            if (v > 2)  return 'color:#3fb950';
            if (v < -2) return 'color:#f85149';
            return 'color:#8b949e';
          }
          function statusBadge(r) {
            if (r.on_ground) return '<span style="background:#1a3a1a;color:#3fb950;font-size:9px;padding:1px 6px;border-radius:3px;font-weight:700">GND</span>';
            if (r.baro_altitude != null && r.baro_altitude < 914)
              return '<span style="background:#3a1212;color:#f85149;font-size:9px;padding:1px 6px;border-radius:3px;font-weight:700">APPR</span>';
            return '<span style="background:#1a2233;color:#58a6ff;font-size:9px;padding:1px 6px;border-radius:3px;font-weight:700">ENRT</span>';
          }

          var TR = '#0d1117', TR_ALT = '#111820';
          tbody.innerHTML = rows.map(function(r, i) {
            var bg = i % 2 === 0 ? TR : TR_ALT;
            var hl = rowHighlight((r.icao24 || '').toUpperCase());
            var rowStyle = hl ? hl : ('background:' + bg + ';');
            var cs = (r.callsign || r.icao24 || '—').trim();
            var isSimulated = cs.startsWith('SIM') || (r.icao24 || '').toUpperCase().startsWith('SIM');
            var csStyle = isSimulated ? 'color:#bc8cff' : 'color:#e6edf3';
            return '<tr style="' + rowStyle + 'border-bottom:1px solid #161b22">' +
              '<td style="padding:6px 10px;' + csStyle + ';font-weight:600">' + cs + '</td>' +
              '<td style="padding:6px 10px;color:#57606a;font-size:11px">' + (r.icao24 || '—') + '</td>' +
              '<td style="padding:6px 10px;color:#8b949e">' + (r.origin_country || '—') + '</td>' +
              '<td style="padding:6px 10px;text-align:right;' + altStyle(r) + '" title="' + mToFt(r.baro_altitude) + '">' +
                fmt(r.baro_altitude) + '</td>' +
              '<td style="padding:6px 10px;text-align:right;' + vrStyle(r.vertical_rate) + '">' +
                (r.vertical_rate != null ? (r.vertical_rate > 0 ? '+' : '') + fmt(r.vertical_rate, 1) : '—') + '</td>' +
              '<td style="padding:6px 10px;text-align:right;color:#e6edf3">' +
                (msToKt(r.velocity) != null ? msToKt(r.velocity) : '—') + '</td>' +
              '<td style="padding:6px 10px;text-align:right;color:#8b949e">' + fmt(r.true_track) + '</td>' +
              '<td style="padding:6px 10px;text-align:center">' + statusBadge(r) + '</td>' +
              '<td style="padding:6px 10px;color:#8b949e">' + (r.squawk || '—') + '</td>' +
              '<td style="padding:6px 10px;color:#57606a;font-size:11px;white-space:nowrap">' + (r._received_at || '—') + '</td>' +
              '</tr>';
          }).join('');
        }
        /* Start raw polling when Flight Events tab is clicked */
        document.addEventListener('DOMContentLoaded', function() {
          document.getElementById('tab-btn-events').addEventListener('click', function() {
            if (!_rawPollTimer) {
              pollRaw();
              _rawPollTimer = setInterval(pollRaw, 3000);
            }
          });
        });

        var _pollTimer = null;
        var _fastPollTimer = null;
        function startPoll() {
          if (_pollTimer) return;
          poll();
          _pollTimer = setInterval(poll, 3000);
        }
        function stopPoll() {
          if (_pollTimer)     { clearInterval(_pollTimer);     _pollTimer     = null; }
          if (_fastPollTimer) { clearInterval(_fastPollTimer); _fastPollTimer = null; }
        }
        function stopRawPoll() {
          if (_rawPollTimer) { clearInterval(_rawPollTimer); _rawPollTimer = null; }
        }
        /* Switch to 1 s polling for `durationMs` ms, then revert to 3 s. */
        function burstPoll(durationMs) {
          stopPoll();
          if (_fastPollTimer) { clearInterval(_fastPollTimer); _fastPollTimer = null; }
          poll();
          _fastPollTimer = setInterval(poll, 1000);
          setTimeout(function() {
            if (_fastPollTimer) { clearInterval(_fastPollTimer); _fastPollTimer = null; }
            stopPoll();
            startPoll();
          }, durationMs);
        }
        function poll() {
          fetch('/api/alerts')
            .then(function(r){ return r.json(); })
            .then(function(data){
              _alertsData = data;
              /* Compute max id before render so card-new class is correct */
              var maxId = 0;
              data.forEach(function(a){ if ((a._id||0) > maxId) maxId = a._id; });
              renderCards(data);
              /* Advance seen-id after render so next poll knows what was new */
              _lastSeenId = maxId;
              var now = new Date();
              document.getElementById('hdr-clock').textContent =
                now.toISOString().slice(11, 19) + ' UTC';
            })
            .catch(function(){ /* ignore transient network errors */ });
        }

        /* ── Flink health poll (every 15 s) ── */
        function pollHealth() {
          fetch('/api/health')
            .then(function(r){ return r.json(); })
            .then(function(d) {
              var dot  = document.getElementById('flink-dot');
              var txt  = document.getElementById('flink-status-text');
              if (!dot || !txt) return;
              if (d.flink_status === 'RUNNING') {
                dot.className = 'hdr-dot';
                dot.title = 'Flink: RUNNING — ' + (d.job_name || d.job_id || '');
                txt.textContent = 'RUNNING';
                txt.style.color = '#3fb950';
              } else if (d.flink_status === 'NO_JOB') {
                dot.className = 'hdr-dot error';
                dot.title = 'Flink: no job running — resubmit SQL';
                txt.textContent = 'NO JOB ⚠';
                txt.style.color = '#f85149';
              } else {
                dot.className = 'hdr-dot warn';
                dot.title = 'Flink: ' + d.flink_status + (d.detail ? ' — ' + d.detail : '');
                txt.textContent = d.flink_status;
                txt.style.color = '#d29922';
              }
            })
            .catch(function() {
              var dot = document.getElementById('flink-dot');
              if (dot) { dot.className = 'hdr-dot warn'; dot.title = 'Flink: unreachable'; }
            });
        }
        pollHealth();
        setInterval(pollHealth, 15000);

        /* ── Drawer open/close ── */
        function openDrawer(id) {
          var a = null;
          for (var i = 0; i < _alertsData.length; i++) {
            if (_alertsData[i]._id === id) { a = _alertsData[i]; break; }
          }
          if (!a) return;
          var _DRAWER_TITLES = {
            'ory_missed_approach':  '🔴 Missed Approach — Details',
            'ory_twin_landing':     '🟡 Twin Landing — Details',
            'ory_repeated_goaround':'🔁 Repeat Go-Around — Details',
            'ory_rapid_descent':    '🔻 Rapid Descent — Details',
            'ory_corridor_overload':'🔵 Corridor Overload — Details',
          };
          document.getElementById('drawerTitle').textContent =
            _DRAWER_TITLES[a._topic] || '📋 Alert Details';
          document.getElementById('drawerBody').innerHTML = buildDrawerHTML(a);
          document.getElementById('drawer').classList.add('open');
          document.getElementById('drawerOverlay').classList.add('open');
        }

        function closeDrawer() {
          document.getElementById('drawer').classList.remove('open');
          document.getElementById('drawerOverlay').classList.remove('open');
        }

        document.addEventListener('keydown', function(e){
          if (e.key === 'Escape') closeDrawer();
        });

        /* ── Wire up all event listeners on DOMContentLoaded ── */
        document.addEventListener('DOMContentLoaded', function() {
          document.getElementById('tab-btn-sim').addEventListener('click',    function(){ showTab('sim'); });
          document.getElementById('tab-btn-live').addEventListener('click',   function(){ showTab('live'); });
          document.getElementById('tab-btn-events').addEventListener('click', function(){ showTab('events'); });
          document.getElementById('tab-btn-tracker').addEventListener('click', function(){
            showTab('tracker');
            trackerActivate();
          });
          document.getElementById('tab-btn-about').addEventListener('click',  function(){ showTab('about'); });
          document.getElementById('drawerOverlay').addEventListener('click', closeDrawer);

          /* Start polling immediately */
          startPoll();

          /* ── Sim control buttons ── */
          function simControl(action) {
            var status = document.getElementById('sim-status');
            var btns   = [
              document.getElementById('sim-btn-start'),
              document.getElementById('sim-btn-stop'),
              document.getElementById('sim-btn-reset'),
            ];
            var labels = { start: 'Starting…', stop: 'Stopping…', reset: 'Resetting…' };
            var ok     = { start: 'Started ✓', stop: 'Stopped ✓', reset: 'Cleared ✓' };

            btns.forEach(function(b){ b.disabled = true; });
            status.textContent = labels[action] || '';
            status.style.color = '#8b949e';

            fetch('/sim/' + action, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: '{}',
            })
              .then(function(r){ return r.json().then(function(body){ return { ok: r.ok, body: body }; }); })
              .then(function(res){
                if (!res.ok) {
                  status.style.color = '#f85149';
                  status.textContent = res.body.message || 'Error';
                } else {
                  status.style.color = '#3fb950';
                  status.textContent = ok[action] || 'Done';
                  if (action === 'reset') {
                    /* Clear alerts panels and Flight Events table immediately.
                       Cancel the raw poll timer so it cannot overwrite the cleared
                       state before the backend seek has settled, then restart it
                       after a short gap so the next fetch reflects empty data. */
                    _alertsData = [];
                    renderCards([]);
                    renderRaw([]);
                    if (_rawPollTimer) {
                      clearInterval(_rawPollTimer);
                      _rawPollTimer = null;
                      setTimeout(function() {
                        pollRaw();
                        _rawPollTimer = setInterval(pollRaw, 3000);
                      }, 2000);
                    }
                    status.textContent = 'Cleared ✓ — waiting for new alerts…';
                    setTimeout(function(){
                      status.textContent = '';
                      status.style.color = '#8b949e';
                    }, 4000);
                  } else if (action === 'start') {
                    /* Restart both poll timers in case Stop had frozen them. */
                    stopPoll();
                    stopRawPoll();
                    /* Poll at 1 s for 45 s: covers pod startup (~5 s) + first MA scenario
                       (~9 s) + Flink watermark (15 s) + margin — first alert within ~30 s. */
                    burstPoll(45000);
                    if (!_rawPollTimer) {
                      pollRaw();
                      _rawPollTimer = setInterval(pollRaw, 3000);
                    }
                    /* Show 'Started ✓' for 3 s, then switch to persistent 'Starting…' */
                    setTimeout(function(){
                      status.style.color = '#8b949e';
                      status.textContent = 'Starting…';
                    }, 3000);
                  } else if (action === 'stop') {
                    /* Freeze the UI: stop polling alerts and raw feed so no new
                       cards appear while the simulator is stopped. */
                    stopPoll();
                    stopRawPoll();
                    setTimeout(function(){
                      status.textContent = '';
                      status.style.color = '#8b949e';
                    }, 3000);
                  }
                }
                btns.forEach(function(b){ b.disabled = false; });
              })
              .catch(function(err){
                status.style.color = '#f85149';
                status.textContent = 'Network error';
                btns.forEach(function(b){ b.disabled = false; });
              });
          }
          document.getElementById('sim-btn-start').addEventListener('click', function(){ simControl('start'); });
          document.getElementById('sim-btn-stop').addEventListener('click',  function(){ simControl('stop');  });
          document.getElementById('sim-btn-reset').addEventListener('click', function(){ simControl('reset'); });
        });

        /* ── Drawer content builder ── */
        function fmt(v) { return v != null ? Math.round(v) : '—'; }
        function fmtFt(m) { return m != null ? Math.round(m * 3.281) + ' ft' : '—'; }

        function buildDrawerHTML(a) {
          if (a._topic === 'ory_missed_approach')  return buildMA(a);
          if (a._topic === 'ory_twin_landing')     return buildTW(a);
          if (a._topic === 'ory_repeated_goaround')return buildRGA(a);
          if (a._topic === 'ory_rapid_descent')    return buildRD(a);
          if (a._topic === 'ory_corridor_overload')return buildCO(a);
          return '<p>Unknown alert type.</p>';
        }

        /* ─── Missed Approach drawer ─── */
        function buildMA(a) {
          var cs     = a.callsign || a.icao24 || '—';
          var alt0   = a.approach_alt  || 0;
          var altGA  = a.go_around_alt || 0;
          // alt0 = entry altitude (A anchor, ~600–900 m), altGA = altitude at last C event.
          // Aircraft descends through alt0 then climbs; recovery = altitude regained above entry.
          var recovery = Math.max(0, altGA - alt0);
          var simTag = a._simulated
            ? '<span style="background:#1e1433;color:#bc8cff;border:1px solid #6e40c9;border-radius:4px;padding:1px 7px;font-size:10px;font-weight:700;">SIMULATED</span> '
            : '<span style="background:#0d2a0d;color:#3fb950;border:1px solid #2a5a2a;border-radius:4px;padding:1px 7px;font-size:10px;font-weight:700;">LIVE</span> ';

          // Severity based on go-around altitude (altGA = last C event = recovery point).
          // Lower altGA means aircraft came closer to ground before climbing out.
          var sevLabel = altGA < 300 ? 'Critical' : altGA < 600 ? 'High' : 'Medium';
          var sevColor = altGA < 300 ? 'red'      : altGA < 600 ? 'yellow' : 'green';
          var sevPct   = Math.max(5, Math.min(95, 100 - (altGA / 914) * 100));

          // mini altitude profile SVG (approach descent + go-around climb)
          var svgH = 110, svgW = 420;
          // normalise altitudes to SVG height
          var maxAlt = 1000;
          var yOf = function(alt){ return svgH - 10 - (Math.min(alt, maxAlt) / maxAlt) * (svgH - 20); };
          // approach segment: cruise → alt0
          var pts = [
            [20,   yOf(900)],
            [80,   yOf(850)],
            [150,  yOf(alt0)],
            [220,  yOf(Math.max(altGA - 80, alt0 * 0.7))],
            [300,  yOf(altGA)],
            [380,  yOf(altGA + 200)],
          ];
          var path = pts.map(function(p,i){ return (i===0?'M':'L')+p[0]+','+p[1]; }).join(' ');

          return '' +
            '<h3>Aircraft</h3>' +
            '<p>' + simTag + '<strong style="color:#e6edf3;font-size:15px;">' + cs + '</strong>' +
            (!a._simulated && a.icao24 ? ' <span style="color:#8b949e;font-size:11px;">· ' + a.icao24 + '</span>' : '') + '</p>' +
            (a.airline ? '<p style="color:#8b949e;font-size:12px;">Airline: ' + a.airline + (a.route ? ' · Route: ' + a.route : '') + '</p>' : '') +

            '<h3>What Happened</h3>' +
            '<p>The aircraft entered the ORY final approach corridor descending through ' +
            '<strong>' + fmt(alt0) + ' m (' + fmtFt(alt0) + ')</strong> with a negative vertical rate, ' +
            'indicating it was established on finals. Instead of completing the landing, ' +
            'it executed a <strong>go-around manoeuvre</strong> — climbing back out to ' +
            '<strong>' + fmt(altGA) + ' m (' + fmtFt(altGA) + ')</strong>. ' +
            'Flink detected the pattern <code>APPROACH → LEVEL* → CLIMBING</code> within the 10-minute CEP window.</p>' +

            '<p>Go-arounds are normal procedure when runway conditions are unsafe or ATC instructs a missed approach. ' +
            'This CEP alert flags the event for review — repeated go-arounds on the same aircraft in a short period may indicate a technical issue.</p>' +

            '<h3>Key Measurements</h3>' +
            '<div class="fact-grid">' +
            '  <div class="fact"><div class="label">Approach altitude</div><div class="value red">' + fmt(alt0) + ' m</div></div>' +
            '  <div class="fact"><div class="label">Go-around altitude</div><div class="value green">' + fmt(altGA) + ' m</div></div>' +
            '  <div class="fact"><div class="label">Recovery gained</div><div class="value yellow">' + fmt(recovery) + ' m</div></div>' +
            '  <div class="fact"><div class="label">Severity</div><div class="value ' + sevColor + '">' + sevLabel + '</div></div>' +
            '</div>' +

            '<h3>Severity Indicator</h3>' +
            '<div class="severity-bar"></div>' +
            '<div class="severity-label"><span>Low risk</span><span>◆ go-around at ' + fmt(altGA) + ' m</span><span>Critical</span></div>' +

            '<h3>Flight Profile</h3>' +
            '<div class="drawer-svg"><svg width="' + svgW + '" height="' + svgH + '" viewBox="0 0 ' + svgW + ' ' + svgH + '" font-family="Segoe UI,sans-serif" font-size="10">' +
            '  <line x1="20" y1="' + svgH + '" x2="' + svgW + '" y2="' + svgH + '" stroke="#21262d" stroke-width="1"/>' +
            '  <line x1="20" y1="' + yOf(914) + '" x2="' + svgW + '" y2="' + yOf(914) + '" stroke="#f85149" stroke-width="1" stroke-dasharray="4,3"/>' +
            '  <text x="22" y="' + (yOf(914) - 3) + '" fill="#f85149" font-size="9">3 000 ft corridor threshold</text>' +
            '  <polyline points="' + pts.map(function(p){return p[0]+','+p[1];}).join(' ') + '" fill="none" stroke="#58a6ff" stroke-width="2.5" stroke-linejoin="round"/>' +
            '  <circle cx="' + pts[2][0] + '" cy="' + pts[2][1] + '" r="5" fill="#f85149"/>' +
            '  <text x="' + (pts[2][0]+7) + '" y="' + (pts[2][1]+4) + '" fill="#f85149">approach ' + fmt(alt0) + 'm</text>' +
            '  <circle cx="' + pts[4][0] + '" cy="' + pts[4][1] + '" r="5" fill="#3fb950"/>' +
            '  <text x="' + (pts[4][0]+7) + '" y="' + (pts[4][1]+4) + '" fill="#3fb950">go-around ' + fmt(altGA) + 'm</text>' +
            '  <text x="' + (svgW/2) + '" y="' + (svgH - 2) + '" fill="#8b949e" text-anchor="middle">time →</text>' +
            '</svg></div>' +

            '<h3>Detection</h3>' +
            '<p>Detected at <strong>' + (a._received_at || '—') + '</strong> via Flink <code>MATCH_RECOGNIZE</code> pattern running on the <code>ory_approach_events</code> view.<br>' +
            'Alert published to Kafka topic <code>ory_missed_approach</code> and consumed by this dashboard.</p>' +
            (a.approach_ts ? '<p style="color:#8b949e;font-size:11px;">approach_ts: ' + a.approach_ts + (a.go_around_ts ? ' · go_around_ts: ' + a.go_around_ts : '') + '</p>' : '');
        }

        /* ─── Twin Landing drawer ─── */
        function buildTW(a) {
          var csA = a.callsign_a || a.icao24_a || '—';
          var csB = a.callsign_b || a.icao24_b || '—';
          var altA = a.alt_a || 0;
          var altB = a.alt_b || 0;
          var diff = Math.abs(altA - altB);
          var simTag = a._simulated
            ? '<span style="background:#1e1433;color:#bc8cff;border:1px solid #6e40c9;border-radius:4px;padding:1px 7px;font-size:10px;font-weight:700;">SIMULATED</span>'
            : '<span style="background:#0d2a0d;color:#3fb950;border:1px solid #2a5a2a;border-radius:4px;padding:1px 7px;font-size:10px;font-weight:700;">LIVE</span>';

          var svgW = 420, svgH = 120;
          var maxAlt = 500;
          var barH = function(alt){ return Math.max(4, (Math.min(alt, maxAlt) / maxAlt) * 80); };
          var y0 = svgH - 20;
          var bHA = barH(altA), bHB = barH(altB);

          return '' +
            '<h3>Source ' + simTag + '</h3>' +

            '<h3>Aircraft Involved</h3>' +
            '<div class="fact-grid">' +
              '  <div class="fact" style="border-color:#58a6ff">' +
              '    <div class="label">Aircraft A</div>' +
              '    <div class="value" style="color:#58a6ff;font-size:13px;">' + csA + '</div>' +
              '    <div style="color:#8b949e;font-size:11px;margin-top:3px;">' + (!a._simulated ? (a.icao24_a||'') : '') + '</div>' +
              '  </div>' +
              '  <div class="fact" style="border-color:#bc8cff">' +
              '    <div class="label">Aircraft B</div>' +
              '    <div class="value" style="color:#bc8cff;font-size:13px;">' + csB + '</div>' +
              '    <div style="color:#8b949e;font-size:11px;margin-top:3px;">' + (!a._simulated ? (a.icao24_b||'') : '') + '</div>' +
              '  </div>' +
              '</div>' +

            '<h3>What Happened</h3>' +
            '<p>Two aircraft were simultaneously inside the ORY short-final zone (below 1 640 ft / 500 m, not on ground) ' +
            'on the <strong>same runway axis</strong> within the same <strong>90-second HOP window</strong>. ' +
            '<strong>' + csA + '</strong> averaged <strong>' + fmt(altA) + ' m</strong> and ' +
            '<strong>' + csB + '</strong> averaged <strong>' + fmt(altB) + ' m</strong> — ' +
            'a vertical separation of only <strong>' + fmt(diff) + ' m (' + fmtFt(diff) + ')</strong>.</p>' +

            '<p>Paris-Orly operates two pairs of parallel runways (06L/06R and 24L/24R). Dependent Parallel Approaches require ≥ 2 NM (≈ 80 s) longitudinal separation between consecutive aircraft on the same approach axis (ICAO Doc 4444 §6.7). ' +
            'Two aircraft simultaneously inside the 500 m short-final zone violates this minimum. ' +
            'Flink detected this via a <code>HOP(90 s, 10 s)</code> self-join on the <code>ory_short_final</code> view.</p>' +

            '<h3>Altitude Comparison</h3>' +
            '<div class="fact-grid">' +
            '  <div class="fact"><div class="label">' + csA + ' avg alt</div><div class="value yellow">' + fmt(altA) + ' m</div></div>' +
            '  <div class="fact"><div class="label">' + csB + ' avg alt</div><div class="value yellow">' + fmt(altB) + ' m</div></div>' +
            '  <div class="fact"><div class="label">Vertical separation</div><div class="value ' + (diff < 100 ? 'red' : 'yellow') + '">' + fmt(diff) + ' m</div></div>' +
            '  <div class="fact"><div class="label">Window</div><div class="value" style="font-size:11px;">' + (a.window_start ? a.window_start.slice(11,16) + ' → ' + a.window_end.slice(11,16) : '90 s HOP') + '</div></div>' +
            '</div>' +

            '<h3>Approach Profile</h3>' +
            '<div class="drawer-svg"><svg width="' + svgW + '" height="' + svgH + '" viewBox="0 0 ' + svgW + ' ' + svgH + '" font-family="Segoe UI,sans-serif" font-size="10">' +
            '  <line x1="40" y1="' + (y0 - 80) + '" x2="40" y2="' + y0 + '" stroke="#21262d" stroke-width="1"/>' +
            '  <line x1="40" y1="' + y0 + '" x2="' + (svgW - 20) + '" y2="' + y0 + '" stroke="#21262d" stroke-width="1"/>' +
            '  <text x="38" y="' + (y0 - 80) + '" fill="#8b949e" text-anchor="end">500 m</text>' +
            '  <text x="38" y="' + y0 + '" fill="#8b949e" text-anchor="end">0 m</text>' +
            // Bar A
            '  <rect x="120" y="' + (y0 - bHA) + '" width="60" height="' + bHA + '" fill="#1a2233" stroke="#58a6ff" stroke-width="1.5" rx="3"/>' +
            '  <text x="150" y="' + (y0 - bHA - 5) + '" fill="#58a6ff" text-anchor="middle">' + fmt(altA) + ' m</text>' +
            '  <text x="150" y="' + (y0 + 12) + '" fill="#58a6ff" text-anchor="middle">' + csA + '</text>' +
            // Bar B
            '  <rect x="240" y="' + (y0 - bHB) + '" width="60" height="' + bHB + '" fill="#1e1433" stroke="#bc8cff" stroke-width="1.5" rx="3"/>' +
            '  <text x="270" y="' + (y0 - bHB - 5) + '" fill="#bc8cff" text-anchor="middle">' + fmt(altB) + ' m</text>' +
            '  <text x="270" y="' + (y0 + 12) + '" fill="#bc8cff" text-anchor="middle">' + csB + '</text>' +
            // Corridor line
            '  <line x1="40" y1="' + (y0 - 80) + '" x2="' + (svgW-20) + '" y2="' + (y0-80) + '" stroke="#d29922" stroke-width="1" stroke-dasharray="4,3"/>' +
            '  <text x="' + (svgW-22) + '" y="' + (y0 - 83) + '" fill="#d29922" text-anchor="end" font-size="9">short-final ceiling (500 m)</text>' +
            '</svg></div>' +

            '<h3>Detection</h3>' +
            '<p>Detected at <strong>' + (a._received_at || '—') + '</strong> via Flink <code>HOP(90 s, 10 s)</code> window self-join on <code>ory_short_final</code>.<br>' +
            'Alert published to Kafka topic <code>ory_twin_landing</code>.</p>' +
            (a.window_start ? '<p style="color:#8b949e;font-size:11px;">Window: ' + a.window_start + ' → ' + a.window_end + '</p>' : '');
        }

        /* ─── Repeat Go-Around drawer ─── */
        function buildRGA(a) {
          var cs = a.callsign || a.icao24 || '—';
          var simTag = a._simulated
            ? '<span style="background:#1e1433;color:#bc8cff;border:1px solid #6e40c9;border-radius:4px;padding:1px 7px;font-size:10px;font-weight:700;">SIMULATED</span> '
            : '<span style="background:#0d2a0d;color:#3fb950;border:1px solid #2a5a2a;border-radius:4px;padding:1px 7px;font-size:10px;font-weight:700;">LIVE</span> ';

          var t1 = a.goaround_1 ? a.goaround_1.slice(11, 19) : '—';
          var t2 = a.goaround_2 ? a.goaround_2.slice(11, 19) : '—';
          // Minutes between the two go-arounds
          var gapMin = '—';
          if (a.goaround_1 && a.goaround_2) {
            // Flink TIMESTAMP(3) fields arrive as "2025-01-15 14:23:01.000" (space separator).
            // Replace space with T so Safari (strict ISO 8601) parses them correctly.
            var d1 = new Date(a.goaround_1.replace(' ', 'T'));
            var d2 = new Date(a.goaround_2.replace(' ', 'T'));
            var ms = d2.getTime() - d1.getTime();
            if (!isNaN(ms)) gapMin = Math.round(ms / 60000);
          }

          // SVG: two go-around bumps on a timeline
          var svgW = 420, svgH = 110;
          var yBase = svgH - 15;
          var bump = function(cx, label, col) {
            var p = 'M' + (cx-60) + ',' + yBase + ' Q' + (cx-30) + ',' + (yBase-55) + ' ' + cx + ',' + (yBase-70) +
                    ' Q' + (cx+30) + ',' + (yBase-55) + ' ' + (cx+60) + ',' + yBase;
            return '<path d="' + p + '" fill="none" stroke="' + col + '" stroke-width="2.5"/>' +
                   '<circle cx="' + cx + '" cy="' + (yBase-70) + '" r="4" fill="' + col + '"/>' +
                   '<text x="' + cx + '" y="' + (yBase-76) + '" fill="' + col + '" text-anchor="middle" font-size="9">' + label + '</text>';
          };

          return '' +
            '<h3>Aircraft ' + simTag + '</h3>' +
            '<p><strong style="color:#e6edf3;font-size:15px;">' + cs + '</strong>' +
            (!a._simulated && a.icao24 ? ' <span style="color:#8b949e;font-size:11px;">· ' + a.icao24 + '</span>' : '') + '</p>' +

            '<h3>What Happened</h3>' +
            '<p>The same aircraft executed <strong>two missed approaches</strong> within a <strong>30-minute window</strong>. ' +
            'A single go-around is a routine safety manoeuvre, but a <em>repeat</em> go-around by the same aircraft suggests a persistent problem: ' +
            'an unstabilised approach, a technical fault, or a recurring runway obstruction.</p>' +
            '<p>Flink detected this by joining the <code>ory_missed_approach</code> stream with itself — matching two alerts on the same <code>icao24</code> ' +
            'within a 30-minute interval.</p>' +

            '<h3>Timeline</h3>' +
            '<div class="fact-grid">' +
            '  <div class="fact"><div class="label">1st go-around</div><div class="value yellow">' + t1 + '</div></div>' +
            '  <div class="fact"><div class="label">2nd go-around</div><div class="value red">' + t2 + '</div></div>' +
            '  <div class="fact"><div class="label">Interval</div><div class="value ' + (typeof gapMin === 'number' && gapMin < 10 ? 'red' : 'yellow') + '">' + gapMin + ' min</div></div>' +
            '  <div class="fact"><div class="label">CEP window</div><div class="value" style="font-size:11px;">30 min</div></div>' +
            '</div>' +

            '<h3>Flight Profile</h3>' +
            '<div class="drawer-svg"><svg width="' + svgW + '" height="' + svgH + '" viewBox="0 0 ' + svgW + ' ' + svgH + '" font-family="Segoe UI,sans-serif" font-size="10">' +
            '  <line x1="20" y1="' + yBase + '" x2="' + (svgW-20) + '" y2="' + yBase + '" stroke="#21262d" stroke-width="1"/>' +
            bump(130, '1st go-around', '#d29922') +
            bump(290, '2nd go-around', '#f85149') +
            '  <text x="' + (svgW/2) + '" y="' + (svgH-3) + '" fill="#8b949e" text-anchor="middle">time →</text>' +
            '</svg></div>' +

            '<h3>Detection</h3>' +
            '<p>Detected at <strong>' + (a._received_at || '—') + '</strong> via Flink interval join on topic <code>ory_missed_approach</code>.<br>' +
            'Alert published to Kafka topic <code>ory_repeated_goaround</code>.</p>';
        }

        /* ─── Rapid Descent drawer ─── */
        function buildRD(a) {
          var cs = a.callsign || a.icao24 || '—';
          var alt   = a.baro_altitude  != null ? a.baro_altitude  : null;
          var vrate = a.vertical_rate  != null ? a.vertical_rate  : null;
          var simTag = a._simulated
            ? '<span style="background:#1e1433;color:#bc8cff;border:1px solid #6e40c9;border-radius:4px;padding:1px 7px;font-size:10px;font-weight:700;">SIMULATED</span> '
            : '<span style="background:#0d2a0d;color:#3fb950;border:1px solid #2a5a2a;border-radius:4px;padding:1px 7px;font-size:10px;font-weight:700;">LIVE</span> ';

          // Severity: vrate < -25 = Critical, < -20 = High, ≤ -18 = Medium (minimum trigger threshold)
          var vr = vrate != null ? vrate : -18;
          var sevLabel = vr < -25 ? 'Critical' : vr < -20 ? 'High' : 'Medium';
          var sevColor = vr < -25 ? 'red'      : vr < -20 ? 'yellow' : 'green';

          // SVG: steep nose-down arrow
          var svgW = 420, svgH = 110;
          var cx = svgW / 2;
          var altPct = alt != null ? Math.min(1, alt / 2000) : 0.5;
          var yAlt = 15 + (1 - altPct) * 70;
          var yLow = yAlt + 55;

          return '' +
            '<h3>Aircraft ' + simTag + '</h3>' +
            '<p><strong style="color:#e6edf3;font-size:15px;">' + cs + '</strong>' +
            (!a._simulated && a.icao24 ? ' <span style="color:#8b949e;font-size:11px;">· ' + a.icao24 + '</span>' : '') + '</p>' +

            '<h3>What Happened</h3>' +
            '<p>An aircraft below <strong>2 000 m</strong> was detected descending at more than <strong>−18 m/s (−3 540 ft/min)</strong>. ' +
            'A descent rate of this magnitude near the ground, without a declared approach, is a potential emergency condition — ' +
            'it may indicate a loss of control, engine failure, or uncontrolled dive.</p>' +
            '<p>Flink detected this by filtering <code>adsb_raw</code> for <code>baro_altitude &lt; 2000</code> AND <code>vertical_rate &lt; −18</code>.</p>' +

            '<h3>Key Measurements</h3>' +
            '<div class="fact-grid">' +
            '  <div class="fact"><div class="label">Altitude</div><div class="value yellow">' + fmt(alt) + ' m (' + fmtFt(alt) + ')</div></div>' +
            '  <div class="fact"><div class="label">Vertical rate</div><div class="value red">' + fmt(vrate) + ' m/s</div></div>' +
            '  <div class="fact"><div class="label">Severity</div><div class="value ' + sevColor + '">' + sevLabel + '</div></div>' +
            '  <div class="fact"><div class="label">Threshold</div><div class="value" style="font-size:11px;">&lt; −18 m/s below 2 000 m</div></div>' +
            '</div>' +

            '<h3>Flight Profile</h3>' +
            '<div class="drawer-svg"><svg width="' + svgW + '" height="' + svgH + '" viewBox="0 0 ' + svgW + ' ' + svgH + '" font-family="Segoe UI,sans-serif" font-size="10">' +
            '  <line x1="20" y1="' + (svgH-10) + '" x2="' + (svgW-20) + '" y2="' + (svgH-10) + '" stroke="#21262d" stroke-width="1"/>' +
            '  <line x1="20" y1="' + 15 + '" x2="20" y2="' + (svgH-10) + '" stroke="#21262d" stroke-width="1"/>' +
            '  <line x1="20" y1="30" x2="' + (svgW-20) + '" y2="30" stroke="#d29922" stroke-width="1" stroke-dasharray="4,3"/>' +
            '  <text x="22" y="27" fill="#d29922" font-size="9">2 000 m ceiling</text>' +
            '  <polyline points="' + (cx-80) + ',' + yAlt + ' ' + cx + ',' + yLow + '" fill="none" stroke="#f85149" stroke-width="3" stroke-linejoin="round"/>' +
            '  <polygon points="' + cx + ',' + (yLow+8) + ' ' + (cx-7) + ',' + (yLow-4) + ' ' + (cx+7) + ',' + (yLow-4) + '" fill="#f85149"/>' +
            '  <circle cx="' + (cx-80) + '" cy="' + yAlt + '" r="5" fill="#58a6ff"/>' +
            '  <text x="' + (cx-72) + '" y="' + (yAlt-5) + '" fill="#58a6ff" font-size="9">' + fmt(alt) + 'm</text>' +
            '  <text x="' + (cx+6) + '" y="' + (yLow+4) + '" fill="#f85149" font-size="9">' + fmt(vrate) + 'm/s</text>' +
            '  <text x="' + (svgW/2) + '" y="' + (svgH-1) + '" fill="#8b949e" text-anchor="middle">time →</text>' +
            '</svg></div>' +

            '<h3>Detection</h3>' +
            '<p>Detected at <strong>' + (a._received_at || '—') + '</strong> via Flink streaming filter on <code>adsb_raw</code>.<br>' +
            'Alert published to Kafka topic <code>ory_rapid_descent</code>.</p>' +
            (a.detection_ts ? '<p style="color:#8b949e;font-size:11px;">detection_ts: ' + a.detection_ts + '</p>' : '');
        }

        /* ─── Corridor Overload drawer ─── */
        function buildCO(a) {
          var count = a.aircraft_count != null ? a.aircraft_count : '—';
          var simTag = a._simulated
            ? '<span style="background:#1e1433;color:#bc8cff;border:1px solid #6e40c9;border-radius:4px;padding:1px 7px;font-size:10px;font-weight:700;">SIMULATED</span>'
            : '<span style="background:#0d2a0d;color:#3fb950;border:1px solid #2a5a2a;border-radius:4px;padding:1px 7px;font-size:10px;font-weight:700;">LIVE</span>';
          var winStart = a.window_start ? a.window_start.slice(11, 16) : '—';
          var winEnd   = a.window_end   ? a.window_end.slice(11, 16)   : '—';

          // Severity: ≥ 5 = Critical, ≥ 4 = High, ≥ 3 = Medium
          var n = typeof count === 'number' ? count : parseInt(count, 10);
          var sevLabel = n >= 5 ? 'Critical' : n >= 4 ? 'High' : 'Medium';
          var sevColor = n >= 5 ? 'red'      : n >= 4 ? 'yellow' : 'green';

          // SVG: funnel with N aircraft symbols descending
          var svgW = 420, svgH = 110;
          var nDraw = Math.min(typeof n === 'number' && !isNaN(n) ? n : 3, 7);
          var planeIcons = '';
          var spacing = Math.min(60, (svgW - 80) / Math.max(nDraw, 1));
          for (var pi = 0; pi < nDraw; pi++) {
            var px = 60 + pi * spacing;
            var py = 20 + (pi % 2) * 12;
            planeIcons += '<text x="' + px + '" y="' + py + '" font-size="18" text-anchor="middle" fill="#58a6ff">✈</text>';
          }

          return '' +
            '<h3>Source ' + simTag + '</h3>' +

            '<h3>What Happened</h3>' +
            '<p><strong>' + count + ' distinct aircraft</strong> were simultaneously inside the ORY approach corridor (below 3 000 ft / 914 m, ' +
            'not on ground) within the same <strong>30-second tumbling window</strong> (' + winStart + ' → ' + winEnd + ').</p>' +
            '<p>Paris-Orly has two independent runways, so at most 2 aircraft should be on simultaneous finals under normal conditions. ' +
            'Three or more is an abnormal traffic density that may indicate an ATC overload or a sequencing breakdown. ' +
            'Flink detected this via <code>COUNT(DISTINCT icao24) ≥ 3</code> in a <code>TUMBLE(30 s)</code> window.</p>' +

            '<h3>Traffic Summary</h3>' +
            '<div class="fact-grid">' +
            '  <div class="fact"><div class="label">Aircraft in corridor</div><div class="value red">' + count + '</div></div>' +
            '  <div class="fact"><div class="label">Severity</div><div class="value ' + sevColor + '">' + sevLabel + '</div></div>' +
            '  <div class="fact"><div class="label">Window start</div><div class="value" style="font-size:11px;">' + winStart + '</div></div>' +
            '  <div class="fact"><div class="label">Window end</div><div class="value" style="font-size:11px;">' + winEnd + '</div></div>' +
            '</div>' +

            '<h3>Approach Traffic</h3>' +
            '<div class="drawer-svg"><svg width="' + svgW + '" height="' + svgH + '" viewBox="0 0 ' + svgW + ' ' + svgH + '" font-family="Segoe UI,sans-serif" font-size="10">' +
            planeIcons +
            '  <path d="M40,40 L' + (svgW/2) + ',95 L' + (svgW-40) + ',40" fill="none" stroke="#21262d" stroke-width="1" stroke-dasharray="3,3"/>' +
            '  <text x="' + (svgW/2) + '" y="' + (svgH-1) + '" fill="#8b949e" text-anchor="middle">ORY approach corridor (30-s window)</text>' +
            '</svg></div>' +

            '<h3>Detection</h3>' +
            '<p>Detected at <strong>' + (a._received_at || '—') + '</strong> via Flink <code>TUMBLE(30 s)</code> aggregate on <code>ory_approach_cep4</code>.<br>' +
            'Alert published to Kafka topic <code>ory_corridor_overload</code>.</p>' +
            (a.window_start ? '<p style="color:#8b949e;font-size:11px;">Window: ' + a.window_start + ' → ' + a.window_end + '</p>' : '');
        }

        /* ══════════════════════ AVIATION FLIGHT TRACKER JS ══════════════════════ */
        (function() {
          var _trackerMap        = null;   // Leaflet map instance
          var _trackerMarkers    = {};     // icao24 → L.Marker
          var _trackerPollTimer  = null;
          var _trackerReady      = false;
          var _trackerSelRow     = null;

          /* ── Lazy-load Leaflet CSS ── */
          function _injectLeafletCSS() {
