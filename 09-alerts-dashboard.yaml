              '.leaflet-crosshair,.leaflet-crosshair .leaflet-interactive{cursor:crosshair}',
              '.leaflet-popup-pane,.leaflet-control{cursor:auto}',
              '.leaflet-dragging .leaflet-grab,.leaflet-dragging .leaflet-grab .leaflet-interactive,.leaflet-dragging .leaflet-marker-draggable{cursor:move;cursor:-webkit-grabbing;cursor:grabbing}',
              '.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-image-layer,.leaflet-pane>svg path,.leaflet-tile-container{pointer-events:none}',
              '.leaflet-marker-icon.leaflet-interactive,.leaflet-image-layer.leaflet-interactive,.leaflet-pane>svg path.leaflet-interactive,svg.leaflet-image-layer.leaflet-interactive path{pointer-events:auto}',
              '.leaflet-container{background:#ddd;outline-offset:1px}',
              '.leaflet-container a{color:#0078A8}',
              '.leaflet-zoom-box{border:2px dotted #38f;background:rgba(255,255,255,.5)}',
              '.leaflet-container{font-family:"Helvetica Neue",Arial,Helvetica,sans-serif;font-size:12px;line-height:1.5}',
              '.leaflet-bar{box-shadow:0 1px 5px rgba(0,0,0,.65);border-radius:4px}',
              '.leaflet-bar a{background-color:#fff;border-bottom:1px solid #ccc;width:26px;height:26px;line-height:26px;display:block;text-align:center;text-decoration:none;color:#000}',
              '.leaflet-bar a:hover,.leaflet-bar a:focus{background-color:#f4f4f4}',
              '.leaflet-bar a:first-child{border-top-left-radius:4px;border-top-right-radius:4px}',
              '.leaflet-bar a:last-child{border-bottom-left-radius:4px;border-bottom-right-radius:4px;border-bottom:none}',
              '.leaflet-bar a.leaflet-disabled{cursor:default;background-color:#f4f4f4;color:#bbb}',
              '.leaflet-control-zoom-in,.leaflet-control-zoom-out{font:bold 18px "Lucida Console",Monaco,monospace;text-indent:1px}',
              '.leaflet-control-layers{box-shadow:0 1px 5px rgba(0,0,0,.4);background:#fff;border-radius:5px}',
              '.leaflet-control-layers-expanded{padding:6px 10px 6px 6px;color:#333;background:#fff}',
              '.leaflet-control-layers label{display:block;font-size:13px}',
              '.leaflet-container .leaflet-control-attribution{background:#fff;background:rgba(255,255,255,.8);margin:0}',
              '.leaflet-control-attribution,.leaflet-control-scale-line{padding:0 5px;color:#333;line-height:1.4}',
              '.leaflet-popup{position:absolute;text-align:center;margin-bottom:20px}',
              '.leaflet-popup-content-wrapper{padding:1px;text-align:left;border-radius:12px}',
              '.leaflet-popup-content{margin:13px 24px 13px 20px;line-height:1.3;font-size:13px;min-height:1px}',
              '.leaflet-popup-content p{margin:1.3em 0}',
              '.leaflet-popup-tip-container{width:40px;height:20px;position:absolute;left:50%;margin-left:-20px;overflow:hidden;pointer-events:none}',
              '.leaflet-popup-tip{width:17px;height:17px;padding:1px;margin:-10px auto 0;pointer-events:auto;-webkit-transform:rotate(45deg);transform:rotate(45deg)}',
              '.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#fff;color:#333;box-shadow:0 3px 14px rgba(0,0,0,.4)}',
              '.leaflet-container a.leaflet-popup-close-button{position:absolute;top:0;right:0;border:none;text-align:center;width:24px;height:24px;font:16px/24px Tahoma,Verdana,sans-serif;color:#757575;text-decoration:none;background:transparent}',
              '.leaflet-container a.leaflet-popup-close-button:hover,.leaflet-container a.leaflet-popup-close-button:focus{color:#585858}',
              '.leaflet-popup-scrolled{overflow:auto}',
              '.leaflet-tooltip{position:absolute;padding:6px;background-color:#fff;border:1px solid #fff;border-radius:3px;color:#222;white-space:nowrap;user-select:none;pointer-events:none;box-shadow:0 1px 3px rgba(0,0,0,.4)}',
              '.leaflet-div-icon{background:#fff;border:1px solid #666}'
            ].join('');
            document.head.appendChild(st);
          }

          /* ── Aircraft SVG icon (same as aviation-tracker) ── */
          function _makeIcon(heading, onGround, isAppr) {
            var color = onGround ? '#d29922' : (isAppr ? '#f85149' : '#3fb950');
            var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="-12 -12 24 24">' +
              '<g transform="rotate(' + (heading || 0) + ')">' +
              '<ellipse cx="0" cy="0" rx="2.2" ry="9" fill="' + color + '"/>' +
              '<polygon points="0,-2 -10,4 0,2 10,4" fill="' + color + '" opacity="0.9"/>' +
              '<polygon points="0,6 -4,10 4,10" fill="' + color + '" opacity="0.85"/>' +
              '</g></svg>';
            return L.divIcon({ html: svg, className: 'aircraft-icon', iconSize: [24,24], iconAnchor: [12,12], popupAnchor: [0,-14] });
          }

          /* ── Popup HTML ── */
          function _popup(s) {
            var call  = (s[1] || '').trim() || '—';
            var alt   = s[7] != null ? Math.round(s[7]).toLocaleString() + ' m' : '—';
            var vel   = s[9] != null ? Math.round(s[9] * 1.94384) + ' kt' : '—';
            var hdg   = s[10] != null ? Math.round(s[10]) + '°' : '—';
            var vrate = s[11] != null ? (s[11] > 0 ? '+' : '') + s[11].toFixed(1) + ' m/s' : '—';
            var sta   = s[8] === false ? '🟢 In flight' : '🟡 On ground';
            return '<div style="font-size:13px;font-weight:700;color:#58a6ff;margin-bottom:5px">' + call + '</div>' +
              '<div style="display:flex;justify-content:space-between;gap:12px;margin:2px 0"><span style="color:#8b949e">Country</span><span style="font-weight:600">' + (s[2] || '?') + '</span></div>' +
              '<div style="display:flex;justify-content:space-between;gap:12px;margin:2px 0"><span style="color:#8b949e">Altitude</span><span style="font-weight:600">' + alt + '</span></div>' +
              '<div style="display:flex;justify-content:space-between;gap:12px;margin:2px 0"><span style="color:#8b949e">Speed</span><span style="font-weight:600">' + vel + '</span></div>' +
              '<div style="display:flex;justify-content:space-between;gap:12px;margin:2px 0"><span style="color:#8b949e">Track</span><span style="font-weight:600">' + hdg + '</span></div>' +
              '<div style="display:flex;justify-content:space-between;gap:12px;margin:2px 0"><span style="color:#8b949e">Vrate</span><span style="font-weight:600">' + vrate + '</span></div>' +
              '<div style="display:flex;justify-content:space-between;gap:12px;margin:2px 0"><span style="color:#8b949e">Status</span><span style="font-weight:600">' + sta + '</span></div>';
          }

          /* ── Render map markers ── */
          function _updateMap(states) {
            var seen = {};
            states.forEach(function(s) {
              var lat = s[6], lon = s[5];
              if (lat == null || lon == null) return;
              var icao   = s[0];
              var onGnd  = s[8] !== false;
              var hdg    = s[10];
              var isAppr = !onGnd && s[7] != null && s[7] < 914;
              seen[icao] = true;
              if (_trackerMarkers[icao]) {
                _trackerMarkers[icao].setLatLng([lat, lon]);
                _trackerMarkers[icao].setIcon(_makeIcon(hdg, onGnd, isAppr));
                _trackerMarkers[icao].getPopup().setContent(_popup(s));
              } else {
                _trackerMarkers[icao] = L.marker([lat, lon], { icon: _makeIcon(hdg, onGnd, isAppr) })
                  .bindPopup(_popup(s), { maxWidth: 240 })
                  .addTo(_trackerMap);
              }
            });
            Object.keys(_trackerMarkers).forEach(function(icao) {
              if (!seen[icao]) { _trackerMap.removeLayer(_trackerMarkers[icao]); delete _trackerMarkers[icao]; }
            });
          }

          /* ── Render table ── */
          function _updateTable(states) {
            var flying = states.filter(function(s){ return s[8] === false && s[7] != null; })
                               .sort(function(a,b){ return (b[7]||0)-(a[7]||0); });
            var ground = states.filter(function(s){ return s[8] !== false; });
            var sorted = flying.concat(ground).slice(0, 80);
            var tbody  = document.getElementById('tracker-tbody');
            if (!sorted.length) {
              tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:#8b949e;padding:20px">No aircraft in ORY area.</td></tr>';
              return;
            }
            tbody.innerHTML = sorted.map(function(s, i) {
              var call  = (s[1] || '').trim() || '—';
              var alt   = s[7] != null ? Math.round(s[7]).toLocaleString() : '0';
              var vr    = s[11] != null ? (s[11] > 0 ? '+' : '') + s[11].toFixed(1) : '–';
              var vel   = s[9] != null  ? Math.round(s[9] * 1.94384) : '–';
              var hdg   = s[10] != null ? Math.round(s[10]) : '–';
              var onGnd = s[8] !== false;
              var isAppr = !onGnd && s[7] != null && s[7] < 914;
              var cls   = onGnd ? 't-gnd' : (isAppr ? 't-appr' : 't-fly');
              var txt   = onGnd ? '🟡 GND' : (isAppr ? '🔴 APPR' : '🟢 FLY');
              return '<tr data-icao="' + s[0] + '" data-lat="' + s[6] + '" data-lon="' + s[5] + '" data-haspos="' + (s[6]!=null&&s[5]!=null) + '">' +
                '<td>' + (i+1) + '</td>' +
                '<td><strong>' + call + '</strong></td>' +
                '<td>' + (s[2] || '?').slice(0, 14) + '</td>' +
                '<td>' + alt + '</td>' +
                '<td>' + vr + '</td>' +
                '<td>' + vel + '</td>' +
                '<td>' + hdg + '</td>' +
                '<td><span class="' + cls + '">' + txt + '</span></td>' +
                '</tr>';
            }).join('');
            /* Row click → pan map + open popup */
            tbody.querySelectorAll('tr[data-icao]').forEach(function(row) {
              row.addEventListener('click', function() {
                if (_trackerSelRow) _trackerSelRow.classList.remove('t-sel');
                row.classList.add('t-sel');
                _trackerSelRow = row;
                if (row.dataset.haspos === 'true' && _trackerMarkers[row.dataset.icao]) {
                  _trackerMap.setView([parseFloat(row.dataset.lat), parseFloat(row.dataset.lon)], Math.max(_trackerMap.getZoom(), 10), { animate: true });
                  _trackerMarkers[row.dataset.icao].openPopup();
                }
              });
            });
          }

          /* ── Update stats bar ── */
          function _updateStats(states, fetched_at) {
            var total  = states.length;
            var flying = states.filter(function(s){ return s[8] === false; }).length;
            var ground = total - flying;
            var appr   = states.filter(function(s){ return s[8] === false && s[7] != null && s[7] < 914; }).length;
            var el = function(id){ return document.getElementById(id); };
            if (el('tr-total'))   el('tr-total').textContent   = total;
            if (el('tr-flying'))  el('tr-flying').textContent  = flying;
            if (el('tr-ground'))  el('tr-ground').textContent  = ground;
            if (el('tr-appr'))    el('tr-appr').textContent    = appr;
            if (el('tr-updated')) el('tr-updated').textContent = fetched_at || '–';
          }

          /* ── Poll /api/tracker ── */
          function _pollTracker() {
            fetch('/api/tracker')
              .then(function(r){ return r.json(); })
              .then(function(data) {
                var errEl = document.getElementById('tracker-err');
                if (data.error) {
                  if (errEl) { errEl.style.display = 'block'; errEl.textContent = '⚠ ' + data.error; }
                } else {
                  if (errEl) errEl.style.display = 'none';
                }
                var states = data.states || [];
                _updateMap(states);
                _updateTable(states);
                _updateStats(states, data.fetched_at);
                var sb = document.getElementById('tracker-statusbar');
                if (sb) sb.textContent = 'ORY box (48.10–49.15°N / 1.90–2.90°E) · ' + states.length + ' aircraft · updated ' + (data.fetched_at || '–') + ' · next in ~60 s';
              })
              .catch(function(e) {
                var sb = document.getElementById('tracker-statusbar');
                if (sb) sb.textContent = 'Error: ' + e.message;
              });
          }

          /* ── Called once when user first opens the tracker tab ── */
          window.trackerActivate = function() {
            if (_trackerReady) {
              /* Already initialised — just invalidate map size (tab was hidden) */
              if (_trackerMap) setTimeout(function(){ _trackerMap.invalidateSize(); }, 50);
              return;
            }
            _trackerReady = true;
            _injectLeafletCSS();

            if (typeof L !== 'undefined') {
              _initMap();
              return;
            }

            /* Leaflet not loaded — try dynamic injection.
               Sources in priority order: aviation-tracker same-cluster, then unpkg. */
            var LEAFLET_SOURCES = [
              '/static/leaflet.js',
              'https://aviation-tracker-test-app.apps-crc.testing/static/leaflet.js',
              'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'
            ];
            var _idx = 0;
            function _tryNext() {
              if (_idx >= LEAFLET_SOURCES.length) {
                document.getElementById('tracker-map').innerHTML =
                  '<div style="display:flex;align-items:center;justify-content:center;height:100%;' +
                  'color:#8b949e;font-size:13px;flex-direction:column;gap:8px;padding:20px;text-align:center">' +
                  '<span style="font-size:32px">🗺</span>' +
                  '<span>Map unavailable (Leaflet could not be loaded).</span>' +
                  '<span style="font-size:11px;color:#57606a">The flight table is still live — data refreshes every 60 s.</span>' +
                  '</div>';
                _pollTracker();
                _trackerPollTimer = setInterval(_pollTracker, 60000);
                return;
              }
              var sc = document.createElement('script');
              sc.src = LEAFLET_SOURCES[_idx++];
              sc.onload = function() { _initMap(); };
              sc.onerror = function() { _tryNext(); };
              document.head.appendChild(sc);
            }
            _tryNext();
          };

          function _initMap() {
            var mapEl = document.getElementById('tracker-map');
            if (!mapEl || _trackerMap) return;
            _trackerMap = L.map('tracker-map', {
              center: [48.7, 2.4],   /* ORY centroid */
              zoom: 11
            });
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
              attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
              maxZoom: 18
            }).addTo(_trackerMap);

            /* ORY bounding box overlay */
            L.rectangle([[48.10, 1.90], [49.15, 2.90]], {
              color: '#58a6ff', weight: 1.5, fillOpacity: 0.04, dashArray: '6,4'
            }).addTo(_trackerMap).bindTooltip('ORY monitoring box', { permanent: false });

            /* ORY airport marker */
            L.marker([48.7233, 2.3794], {
              icon: L.divIcon({
                html: '<div style="background:#d29922;color:#0d1117;font-size:9px;font-weight:700;padding:2px 5px;border-radius:3px;white-space:nowrap;">ORY</div>',
                className: '', iconAnchor: [14, 10]
              })
            }).addTo(_trackerMap).bindPopup('<strong style="color:#d29922">Paris-Orly Airport (ORY)</strong><br><span style="color:#8b949e;font-size:11px;">IATA: ORY · ICAO: LFPO</span>');

            _pollTracker();
            _trackerPollTimer = setInterval(_pollTracker, 60000);
          }

          /* ── If Leaflet was already loaded (e.g. page refresh), auto-detect ── */
          document.addEventListener('DOMContentLoaded', function() {
            /* Pre-check: Leaflet will be available if aviation-tracker injected it
               in a shared session. Most likely it won't be — handled in trackerActivate(). */
          });

        })(); /* end IIFE */
      </script>
    </body>
    </html><!--HTML_END-->"""

    _HTML_MARKER_START = '<!--HTML_START-->'
    _HTML_MARKER_END   = '<!--HTML_END-->'

    @app.route("/")
    def index():
        # Re-read /scripts/app.py on every request — picks up ConfigMap
        # volume updates without a pod restart.
        try:
            src = open('/scripts/app.py', encoding='utf-8').read()
            s = src.index(_HTML_MARKER_START) + len(_HTML_MARKER_START)
            e = src.index(_HTML_MARKER_END)
            from flask import Response
            return Response(src[s:e], mimetype='text/html',
                headers={'Cache-Control': 'no-store'})
        except Exception:
            from flask import Response
            return Response(render_template_string(_HTML), mimetype='text/html',
                headers={'Cache-Control': 'no-store'})

    if __name__ == "__main__":
        app.run(host="0.0.0.0", port=PORT)
---
# Deployment for the alerts dashboard
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alerts-dashboard
  namespace: plane-track
  labels:
    app: alerts-dashboard
    app.kubernetes.io/part-of: plane-track
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alerts-dashboard
  template:
    metadata:
      labels:
        app: alerts-dashboard
    spec:
      serviceAccountName: plane-track-sa
      initContainers:
        - name: pip-install
          image: docker.io/python:3.12-slim
          command:
            - /bin/sh
            - -c
            - |
              pip install --quiet --no-cache-dir flask kafka-python-ng requests --target /deps ; rm -rf /deps/kafka-[0-9]*.dist-info 2>/dev/null ; echo "deps ready"
          volumeMounts:
            - name: deps
              mountPath: /deps
      containers:
        - name: dashboard
          image: docker.io/python:3.12-slim
          command:
            - /bin/sh
            - -c
            - |
              export PYTHONPATH=/deps
              python /scripts/app.py
          env:
            - name: PORT
              value: "8080"
            - name: KAFKA_BOOTSTRAP
              value: "broker:29092"
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 25
            periodSeconds: 20
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: deps
              mountPath: /deps
      volumes:
        - name: scripts
          configMap:
            name: alerts-dashboard-script
        - name: deps
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alerts-dashboard
  namespace: plane-track
spec:
  selector:
    app: alerts-dashboard
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: alerts-dashboard
  namespace: plane-track
spec:
  to:
    kind: Service
    name: alerts-dashboard
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect





