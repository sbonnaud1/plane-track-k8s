---
# Kafka (apache/kafka:3.7.0 — KRaft single-node, no Zookeeper)
# Uses localhost for controller quorum to avoid DNS bootstrap issues.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: broker
  namespace: plane-track
  labels:
    app: broker
    app.kubernetes.io/part-of: plane-track
spec:
  replicas: 1
  selector:
    matchLabels:
      app: broker
  template:
    metadata:
      labels:
        app: broker
    spec:
      serviceAccountName: plane-track-sa
      containers:
        - name: broker
          image: docker.io/apache/kafka:3.7.0
          env:
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_NODE_ID
              value: "1"
            # Use localhost:9093 for controller quorum — avoids DNS issues on single-node
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@localhost:9093"
            # PLAINTEXT for internal client connections, CONTROLLER for KRaft, EXTERNAL for outside-pod access
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://:29092,CONTROLLER://:9093,EXTERNAL://:9092"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://broker.plane-track.svc.cluster.local:29092,EXTERNAL://broker.plane-track.svc.cluster.local:9092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            # A valid 22-char base64 KRaft cluster ID
            - name: KAFKA_CLUSTER_ID
              value: "MkU3OEVBNTcwNTJENDM2Qk"
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          ports:
            - containerPort: 9092
            - containerPort: 29092
            - containerPort: 9093
---
apiVersion: v1
kind: Service
metadata:
  name: broker
  namespace: plane-track
spec:
  selector:
    app: broker
  ports:
    - name: external
      port: 9092
      targetPort: 9092
    - name: internal
      port: 29092
      targetPort: 29092
