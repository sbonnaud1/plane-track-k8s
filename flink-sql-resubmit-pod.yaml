apiVersion: v1
kind: Pod
metadata:
  name: flink-sql-resubmit
  namespace: plane-track
  labels:
    app.kubernetes.io/part-of: plane-track
spec:
  serviceAccountName: plane-track-sa
  restartPolicy: Never
  volumes:
    - name: sql
      configMap:
        name: flink-sql-ory
    - name: data-csv
      configMap:
        name: data-csv
  containers:
    - name: flink-sql-resubmit
      image: docker.io/cnfldemos/flink-sql-client-kafka:1.19.1-scala_2.12-java17
      command:
        - /bin/bash
        - -c
        - |
          export FLINK_CONF_DIR=/opt/flink/conf
          for f in /sql/cep1_missed_approach.sql \
                   /sql/cep2_twin_landing.sql \
                   /sql/cep3_rapid_descent.sql \
                   /sql/cep4_corridor_overload.sql \
                   /sql/cep5_repeated_goaround.sql; do
            echo "[resubmit] Submitting $f ..."
            /opt/flink/bin/sql-client.sh --file "$f" \
              && echo "[resubmit] OK: $f" \
              || echo "[resubmit] FAILED: $f"
            sleep 10
          done
          echo "[resubmit] All CEP files submitted."
      env:
        - name: FLINK_JOBMANAGER_HOST
          value: flink-jobmanager
      volumeMounts:
        - name: sql
          mountPath: /sql
        - name: data-csv
          mountPath: /data_csv
